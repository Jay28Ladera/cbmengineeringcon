<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot password')}"></head>
<body>
<main class="auth" th:fragment="page">
  <section th:replace="~{fragments/auth :: brand}"></section>

  <section class="auth-panel">
    <div class="auth-card">
      <h2>Forgot your password?</h2>
      <p class="lead-text">Enter the email address on your account and we'll send you a link to choose a new password.</p>

      <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

      <form th:action="@{/forgot-password}" method="post">
        <div class="field">
          <label class="form-label" for="email">Email address</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email" required autofocus />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>

      <div class="auth-alt"><a th:href="@{/login}" class="fw-semibold"><i class="bi bi-arrow-left me-1"></i>Back to sign in</a></div>
    </div>
  </section>
</main>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
