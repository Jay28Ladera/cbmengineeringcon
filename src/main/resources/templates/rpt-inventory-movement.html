<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inventory movement')}"></head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar(role=${role}, activePage=${activePage})}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/header :: header(${username})}"></div>
    <main class="content-area" th:fragment="page" data-section="Reports" data-title="Inventory movement">
      <div class="page-header">
        <div><div class="page-eyebrow">Reports</div><h1 class="page-title">Inventory movement</h1>
          <p class="page-sub">Quantities in (deliveries, returns, recounts) and out (issues to jobs, losses) in the period.</p></div>
        <form class="page-actions d-flex gap-2 align-items-end" method="get">
          <div><label class="form-label small mb-0" for="rf">From</label><input id="rf" type="date" name="from" class="form-control form-control-sm" th:value="${from}" /></div>
          <div><label class="form-label small mb-0" for="rt">To</label><input id="rt" type="date" name="to" class="form-control form-control-sm" th:value="${to}" /></div>
          <button class="btn btn-sm btn-outline" type="submit">Show</button>
          <button class="btn btn-sm btn-ghost" type="button" onclick="window.print()"><i class="bi bi-printer"></i>Print</button>
        </form>
      </div>
      <section class="panel">
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Material</th><th class="num">Opening</th><th class="num">In</th><th class="num">Out</th><th class="num">Closing</th><th>Unit</th><th class="money">Value in</th><th class="money">Value out</th></tr></thead>
          <tbody><tr th:each="r : ${rows}" th:with="m=${r.material()}">
            <td><span th:text="${m.name}"></span><div class="cell-sub mono" th:text="${m.code}"></div></td>
            <td class="num" th:text="${r.opening().stripTrailingZeros().toPlainString()}"></td>
            <td class="num text-success" th:text="${r.in().signum() > 0 ? '+' + r.in().stripTrailingZeros().toPlainString() : ''}"></td>
            <td class="num" th:text="${r.out().signum() > 0 ? '−' + r.out().stripTrailingZeros().toPlainString() : ''}"></td>
            <td class="num fw-semibold" th:text="${r.closing().stripTrailingZeros().toPlainString()}"></td><td th:text="${m.unit}"></td>
            <td class="money" th:text="${#numbers.formatDecimal(r.inValue(), 1, 'COMMA', 2, 'POINT')}"></td>
            <td class="money" th:text="${#numbers.formatDecimal(r.outValue(), 1, 'COMMA', 2, 'POINT')}"></td></tr></tbody>
        </table></div>
        <div class="panel-body text-muted small" th:if="${#lists.isEmpty(rows)}">No stock movements.</div>
      </section>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
