<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Stock Issue')}"></head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar(role=${role}, activePage=${activePage})}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/header :: header(${username})}"></div>
    <main class="content-area" th:fragment="page" data-section="Inventory" data-title="Stock Issue">
      <div class="page-header">
        <div><div class="page-eyebrow"><a th:href="@{/Inventory/StockIssuance}">Stock issuance</a></div>
          <h1 class="page-title"><span class="mono" th:text="${i.number}"></span> <span th:if="${i.voided}" class="status status-rejected">Voided</span></h1>
          <p class="page-sub"><span th:text="${#temporals.format(i.issuedOn, 'MMMM d, yyyy')}"></span>
            <span th:if="${job}"> · <a th:href="@{/JobOrders/{id}(id=${job.id()})}" th:text="${job.label}"></a></span>
            <span th:if="${i.issuedTo}" th:text="${' · received by ' + i.issuedTo}"></span></p></div>
        <div class="page-actions" th:unless="${i.voided}"><button class="btn btn-ghost" type="button" data-open-dialog="voidDialog"><i class="bi bi-x-circle"></i>Void</button></div>
      </div>
      <div th:if="${success}" class="alert alert-success mb-3" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>
      <div class="alert alert-warning mb-3" th:if="${i.voided}"><span th:text="${'Voided: ' + i.voidReason}"></span></div>
      <section class="panel">
        <div class="panel-body" th:if="${i.purpose}"><p class="mb-0" th:text="${i.purpose}"></p></div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Material</th><th class="num">Qty</th><th class="money">Unit cost</th><th class="money">Cost</th></tr></thead>
          <tbody><tr th:each="l : ${lines}" th:with="m=${materialMap[l.materialId]}">
            <td><a th:href="@{/Inventory/Materials/{id}(id=${l.materialId})}" th:text="${m != null ? m.code + ' · ' + m.name : '?'}"></a></td>
            <td class="num" th:text="${l.qty.stripTrailingZeros().toPlainString() + (m != null ? ' ' + m.unit : '')}"></td>
            <td class="money" th:text="${#numbers.formatDecimal(l.unitCost, 1, 'COMMA', 2, 'POINT')}"></td>
            <td class="money" th:text="${#numbers.formatDecimal(l.amount, 1, 'COMMA', 2, 'POINT')}"></td></tr></tbody>
          <tfoot><tr><td colspan="3" class="text-end fw-semibold">Charged to the job order</td><td class="money fw-semibold" th:text="${'₱' + #numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></td></tr></tfoot>
        </table></div>
        <div class="panel-footer small text-muted" th:text="${'Entered by ' + i.createdBy + ' · ' + #temporals.format(i.createdAt, 'MMM d, h:mm a')}"></div>
      </section>
      <dialog class="app-dialog app-dialog-sm" id="voidDialog" aria-labelledby="vTitle">
        <form th:action="@{/Inventory/StockIssuance/{id}/void(id=${i.id})}" method="post">
          <header class="dialog-header"><div><h2 id="vTitle">Void this issuance?</h2><p>The materials go back into stock and their cost comes off the job order. For a partial return from site, use a stock adjustment (Returned) instead.</p></div><button class="dialog-close" type="button" aria-label="Close" data-close-dialog="voidDialog"><i class="bi bi-x-lg"></i></button></header>
          <div class="dialog-body"><label class="form-label" for="vr">Reason <span class="req">*</span></label><input id="vr" name="reason" class="form-control" maxlength="300" required /></div>
          <footer class="dialog-footer"><button type="button" class="btn btn-ghost" data-close-dialog="voidDialog">Keep it</button><button type="submit" class="btn btn-danger">Void</button></footer>
        </form>
      </dialog>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
