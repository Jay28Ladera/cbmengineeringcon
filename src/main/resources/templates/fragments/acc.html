<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- The ledger entry behind a document: journal (may be null), jlines, accountMap, preview -->
<section class="panel mb-4" th:fragment="journal">
  <div class="panel-header">
    <h2 class="panel-title"><i class="bi bi-journal-text"></i><span th:text="${preview ? 'Accounting entry on release' : 'Accounting entry'}"></span>
      <a th:if="${journal != null}" class="mono small ms-2" th:href="@{/Accounting/Journal/{id}(id=${journal.id})}" th:text="${journal.number}"></a>
      <span th:if="${journal != null and journal.status == 'VOID'}" class="status status-je-void ms-1">Reversed</span></h2>
  </div>
  <div class="table-wrap" th:unless="${#lists.isEmpty(jlines)}">
    <table class="data-table je-table">
      <thead><tr><th>Account</th><th>Memo</th><th class="money">Debit</th><th class="money">Credit</th></tr></thead>
      <tbody>
        <tr th:each="l : ${jlines}" th:with="a=${accountMap.get(l.accountId)}">
          <td><a th:if="${a != null}" th:href="@{/Accounting/Accounts/{id}(id=${a.id})}"><span class="mono" th:text="${a.code}"></span> <span th:text="${a.name}"></span></a></td>
          <td class="cell-wrap" th:text="${l.memo}"></td>
          <td class="money" th:text="${l.debit.signum() > 0 ? #numbers.formatDecimal(l.debit, 1, 'COMMA', 2, 'POINT') : ''}"></td>
          <td class="money" th:text="${l.credit.signum() > 0 ? #numbers.formatDecimal(l.credit, 1, 'COMMA', 2, 'POINT') : ''}"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="panel-body text-muted small" th:if="${#lists.isEmpty(jlines)}">Nothing posted yet.</div>
</section>
<!-- A margin % as a small bar: green when healthy, amber when thin, red when negative -->
<div th:fragment="marginBar(m)" class="d-flex align-items-center gap-2">
  <div style="flex:1;height:8px;background:var(--steel-100,#eef1f5);border-radius:4px;overflow:hidden;min-width:60px">
    <div th:if="${m != null}" th:style="${'height:100%;border-radius:4px;width:' + (m.signum() < 0 ? 100 : (m.doubleValue() > 100 ? 100 : m.doubleValue())) + '%;background:' + (m.signum() < 0 ? '#c8151d' : (m.doubleValue() < 10 ? '#d97706' : '#15803d'))}"></div>
  </div>
  <span class="small fw-semibold" style="min-width:52px;text-align:right" th:classappend="${m != null and m.signum() < 0} ? ' text-danger'" th:text="${m != null ? m + '%' : '—'}"></span>
</div>
</body>
</html>
