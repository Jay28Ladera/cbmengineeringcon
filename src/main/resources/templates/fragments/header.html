<!-- fragments/header.html -->
<div th:fragment="header(username)"
     class="header-container navbar navbar-expand-lg shadow-sm px-3"
     style="font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; min-height: 70px; position: sticky; top: 0; z-index: 1020; backdrop-filter: blur(10px);">

  <!-- Logo & Title -->
  <a class="navbar-brand d-flex align-items-center text-white text-decoration-none" href="/home">
    <img src="/images/logo.png" alt="Sisters of Mary Schools Logo" class="me-3" style="width:50px;height:50px;border-radius:8px;" />
    <div class="d-flex flex-column">
      <span class="fw-semibold mb-0" style="font-size:1.1rem;">Sisters of Mary School- Boystown Incorporated</span>
      <span class="text-light opacity-90" style="font-size:.85rem;">ADMINISTRATIVE MANAGEMENT SYSTEM</span>
    </div>
  </a>

  <!-- Right side -->
  <div class="ms-auto d-flex align-items-center">

    <!-- User dropdown -->
    <div class="dropdown">
      <button class="btn btn-link text-white text-decoration-none d-flex align-items-center dropdown-toggle"
              type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false"
              style="border:none;background:none;padding:0;">
        <span class="me-2 fw-semibold" th:text="${username}" style="margin-right:8px;">John Doe</span>

        <!-- Avatar -->
        <img th:src="${profileImageUrl != null and !#strings.isEmpty(profileImageUrl)} ? ${profileImageUrl} : @{/images/logo.png}"
     src="/images/logo.png"
     alt="Avatar"
     class="rounded-circle border border-2 border-white border-opacity-50"
     style="width:45px;height:45px;object-fit:cover;" />
      </button>

      <ul class="dropdown-menu dropdown-menu-end shadow"
          aria-labelledby="userDropdown"
          style="border:none;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.1);margin-top:8px;">

        <!-- PROFILE goes to profile.html (/profile) -->
        <li>
          <a class="dropdown-item d-flex align-items-center"
             th:href="@{/profile}">
            <i class="bi bi-person me-2"></i>Profile
          </a>
        </li>

        <!-- Settings normal link -->
        <li>
          <a class="dropdown-item d-flex align-items-center" href="/settings">
            <i class="bi bi-gear me-2"></i>Settings
          </a>
        </li>

        <li><hr class="dropdown-divider"></li>

        <!-- Logout -->
        <li>
          <form th:action="@{/logout}" method="post" class="m-0">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
            <button type="submit" class="dropdown-item d-flex align-items-center text-danger">
              <i class="bi bi-box-arrow-right me-2"></i>Logout
            </button>
          </form>
        </li>
      </ul>
    </div>
  </div>

  <style>
    .dropdown-toggle::after{ display:none; }
    .dropdown-item{ padding:10px 16px; border-radius:8px; margin:2px 6px; }
    .dropdown-item:hover{ background-color:#f8f9fa; transform:translateX(2px); transition:all .2s; }

    @media (max-width: 768px){
      .header-container{ min-height:60px; padding:.5rem 1rem !important; }
      .navbar-brand img{ width:35px !important; height:35px !important; }
      .navbar-brand .d-flex.flex-column span:first-child{ font-size:.85rem !important; }
      .navbar-brand .d-flex.flex-column span:last-child{ font-size:.65rem !important; }
      .dropdown button img{ width:35px !important; height:35px !important; }
      .dropdown button span{ display:none; }
    }
    @media (max-width: 576px){
      .header-container{ min-height:55px; padding:.25rem .5rem !important; }
      .navbar-brand .d-flex.flex-column span:last-child{ display:none; }
    }
  </style>
</div>
