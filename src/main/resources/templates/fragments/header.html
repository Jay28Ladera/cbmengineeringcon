<!-- fragments/header.html: top bar of the signed-in app. Styles are in /css/app.css. -->
<header th:fragment="header(username)" class="topbar">
  <button class="topbar-menu" type="button" id="mobileMenuButton" aria-label="Open menu" aria-controls="sidebar">
    <i class="bi bi-list"></i>
  </button>

  <nav class="topbar-crumbs" aria-label="Breadcrumb">
    <span class="crumb-root">CBM Workspace</span>
    <i class="bi bi-chevron-right"></i>
    <span class="crumb-section" id="crumbSection"></span>
    <i class="bi bi-chevron-right crumb-sep" id="crumbSep"></i>
    <span class="crumb-title" id="crumbTitle"></span>
  </nav>

  <div class="topbar-actions">
    <a class="btn btn-primary btn-sm topbar-cta" th:href="@{/Clients(openInquiry=1)}">
      <i class="bi bi-plus-lg"></i><span>New inquiry</span>
    </a>

    <div class="dropdown">
      <button class="user-menu" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="avatar" th:if="${profileImageUrl == null}" th:text="${userInitials}">CB</span>
        <img class="avatar" th:if="${profileImageUrl != null}" th:src="${profileImageUrl}" alt="" />
        <span class="user-meta">
          <span class="user-name" th:text="${displayName ?: username}">CBM User</span>
          <span class="user-role" th:text="${role}">user</span>
        </span>
        <i class="bi bi-chevron-down"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
        <li class="dropdown-heading">
          <span class="dropdown-label">Signed in as</span>
          <span class="dropdown-user" th:text="${username}">user</span>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person"></i>My profile</a></li>
        <li th:if="${isAdmin}"><a class="dropdown-item" th:href="@{/users}"><i class="bi bi-people"></i>User management</a></li>
        <li><a class="dropdown-item" th:href="@{/}" target="_blank" rel="noopener"><i class="bi bi-globe2"></i>Public website</a></li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="dropdown-item logout-item"><i class="bi bi-box-arrow-right"></i>Sign out</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>
