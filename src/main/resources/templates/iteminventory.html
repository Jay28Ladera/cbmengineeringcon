<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Inventory - Sisters of Mary Schools</title>

  <!-- Bootstrap & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />
  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

  <style>
    body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);color:#334155;margin:0}
    .app-container{display:flex;min-height:100vh}
    .main-content{flex:1;display:flex;flex-direction:column;margin-left:280px;transition:margin-left .3s cubic-bezier(.4,0,.2,1)}
    #sidebar.sidebar-collapsed ~ .main-content{margin-left:75px}
    .content-area{flex:1;padding:2.5rem;position:relative}
    .page-header{background:#fff;border:2px solid #e2e8f0;border-radius:16px;box-shadow:0 4px 25px rgba(0,0,0,.06);margin-bottom:2rem;position:relative;overflow:hidden}
    .page-header::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#4169e1 0%,#6366f1 50%,#8b5cf6 100%)}
    .page-header .card-body{padding:2rem}
    .page-header h2{color:#1e293b;font-weight:800;font-size:1.75rem;margin-bottom:.5rem}
    .btn-custom{border-radius:12px;font-weight:600;padding:.75rem 1.5rem;transition:.3s;box-shadow:0 4px 15px rgba(0,0,0,.1);border:none}
    .btn-custom:hover{transform:translateY(-3px) scale(1.02)}
    .btn-primary.btn-custom{background:linear-gradient(135deg,#4169e1 0%,#3754db 100%)}
    .card{border:none;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.12),0 4px 16px rgba(65,105,225,.1);background:#fff}
    .table td,.table th{vertical-align:middle}
    .img-thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #e5e7eb}
    /* DataTables cosmetics */
    .dataTables_wrapper{padding:1.25rem}
    .dataTables_filter input{border-radius:12px;border:2px solid #cbd5e1;padding:.6rem 1rem}
    .dataTables_wrapper .dataTables_paginate .paginate_button{border-radius:10px;border:2px solid #e2e8f0;padding:6px 12px;margin:0 4px;background:#fff;color:#4169e1}
    .dataTables_wrapper .dataTables_paginate .paginate_button.current{background:#4169e1;color:#fff;border-color:#4169e1}
    @media (max-width:768px){.main-content{margin-left:0!important;padding-top:70px}}
  </style>
</head>

<body>
<div class="app-container">
  <!-- Sidebar -->
  <div th:replace="fragments/sidebar :: sidebar(role=${role}, activePage='inventory',
       studentInfoExpanded=${studentInfoExpanded},
       asmsiExpanded=${asmsiExpanded},
       admissionExpanded=${admissionExpanded},
       attendanceExpanded=${attendanceExpanded},
       eventsExpanded=${eventsExpanded},
       familyDayExpanded=${familyDayExpanded},
       merchandiseExpanded=${merchandiseExpanded})"></div>

  <!-- Main -->
  <div class="main-content">
    <div th:replace="fragments/header :: header(${username})"></div>

    <main class="content-area">
      <!-- Header -->
      <div class="page-header card">
        <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div>
            <h2><i class="bi bi-box-seam me-3"></i>Item Inventory</h2>
            <p class="mb-0 text-muted">Manage merchandise items used by the POS. Add, edit, or remove items and download barcodes.</p>
          </div>
          <div class="d-flex flex-wrap gap-3">
            <button class="btn btn-primary btn-custom" data-bs-toggle="modal" data-bs-target="#itemModal">
              <i class="bi bi-plus-lg me-2"></i>Add Item
            </button>
            <a href="/pos" class="btn btn-outline-primary btn-custom">
              <i class="bi bi-cash-register me-2"></i>Open POS
            </a>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="table-responsive p-3">
          <table id="itemsTable" class="table table-hover align-middle">
            <thead>
              <tr>
                <th><i class="bi bi-image me-1"></i>Image</th>
                <th><i class="bi bi-upc me-1"></i>Item #</th>
                <th><i class="bi bi-tag me-1"></i>Name</th>
                <th class="text-end"><i class="bi bi-boxes me-1"></i>Stocks</th>
                <th class="text-end"><i class="bi bi-graph-up me-1"></i>Sold</th> <!-- NEW -->
                <th class="text-end"><i class="bi bi-cash-coin me-1"></i>Price</th>
                <th class="text-center"><i class="bi bi-gear me-1"></i>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="it : ${items}">
                <td>
                  <img th:src="${it.imageUrl} ?: @{/images/default-product.png}" alt="" class="img-thumb">
                </td>
                <td th:text="${it.itemNumber}">SKU-0001</td>
                <td th:text="${it.name}">Sample Item</td>
                <td class="text-end" th:text="${it.stocks}">0</td>
                <!-- NEW: total sold = soldCounts[itemId] or 0 when absent -->
                <td class="text-end" th:text="${soldCounts[it.id]} ?: 0">0</td>
                <td class="text-end" th:text="${#numbers.formatDecimal(it.price,1,'COMMA',2,'POINT')}">0.00</td>
                <td class="text-center">
                  <div class="btn-group">
                    <!-- Edit -->
                    <button class="btn btn-sm btn-outline-secondary"
                            data-bs-toggle="modal" data-bs-target="#itemModal"
                            th:attr="data-id=${it.id},data-itemnumber=${it.itemNumber},
                                     data-name=${it.name},data-stocks=${it.stocks},
                                     data-price=${it.price},data-imageurl=${it.imageUrl}">
                      <i class="bi bi-pencil"></i>
                    </button>
                    <!-- Delete -->
                    <form th:action="@{'/inventory/delete/' + ${it.id}}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this item?');">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button class="btn btn-sm btn-outline-danger" type="submit">
                        <i class="bi bi-trash"></i>
                      </button>
                    </form>
                    <!-- Barcode -->
                    <button class="btn btn-sm btn-outline-primary"
                            th:attr="data-code=${it.itemNumber}, data-name=${it.name}"
                            onclick="downloadBarcode(this)">
                      <i class="bi bi-upc"></i>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Add/Edit Modal -->
      <div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <form class="modal-content" th:action="@{/inventory/save}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="modal-header" style="background:#4169e1;color:#fff">
              <h5 class="modal-title">Item</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="background:#f8fafc">
              <input type="hidden" name="id" id="m-id">
              <div class="mb-3">
                <label class="form-label">Item # (Barcode/SKU) *</label>
                <input type="text" class="form-control" name="itemNumber" id="m-itemNumber" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Name *</label>
                <input type="text" class="form-control" name="name" id="m-name" required>
              </div>
              <div class="row g-3">
                <div class="col-6">
                  <label class="form-label">Stocks *</label>
                  <input type="number" class="form-control" name="stocks" id="m-stocks" min="0" value="0" required>
                </div>
                <div class="col-6">
                  <label class="form-label">Price (PHP) *</label>
                  <input type="number" step="0.01" class="form-control" name="price" id="m-price" min="0" value="0.00" required>
                </div>
              </div>
              <div class="mt-3">
                <label class="form-label">Image URL</label>
                <input type="url" class="form-control" name="imageUrl" id="m-imageUrl" placeholder="https://...">
                <div class="form-text">Paste the image URL (Cloudinary/S3/static). Optional.</div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button class="btn btn-primary" type="submit">Save</button>
            </div>
          </form>
        </div>
      </div>

      <!-- hidden SVG for barcode -->
      <svg id="barcodeSvg" style="position:absolute;left:-9999px;top:-9999px;"></svg>

    </main>
  </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script>
  $(function(){
    // DataTable
    $('#itemsTable').DataTable({
      pageLength: 10,
      lengthChange: true,
      language:{
        search:"",
        searchPlaceholder:"Search items...",
        lengthMenu:"Show _MENU_ per page"
      },
      columnDefs:[
        { orderable:false, targets:[0,6] },
        { className:"text-end", targets:[3,4,5] },  // stocks, sold, price
        { className:"text-center", targets:[6] }
      ]
    });

    // Modal: fill for edit / clear for add
    const modal = document.getElementById('itemModal');
    modal.addEventListener('show.bs.modal', function (e) {
      const btn = e.relatedTarget;
      const q = modal.querySelector.bind(modal);
      if (btn && btn.hasAttribute('data-id')) {
        q('#m-id').value = btn.getAttribute('data-id') || '';
        q('#m-itemNumber').value = btn.getAttribute('data-itemnumber') || '';
        q('#m-name').value = btn.getAttribute('data-name') || '';
        q('#m-stocks').value = btn.getAttribute('data-stocks') || 0;
        q('#m-price').value = btn.getAttribute('data-price') || 0;
        q('#m-imageUrl').value = btn.getAttribute('data-imageurl') || '';
        modal.querySelector('.modal-title').textContent = 'Edit Item';
      } else {
        q('#m-id').value=''; q('#m-itemNumber').value=''; q('#m-name').value='';
        q('#m-stocks').value=0; q('#m-price').value=0; q('#m-imageUrl').value='';
        modal.querySelector('.modal-title').textContent = 'Add Item';
      }
    });
  });

  // Barcode download
  function downloadBarcode(btn){
    const code = btn.getAttribute('data-code');
    const name = btn.getAttribute('data-name') || '';
    if (!code) return;

    // Draw barcode to hidden SVG
    JsBarcode('#barcodeSvg', code, {
      format:'CODE128', width:2, height:80, displayValue:true, fontSize:14, margin:10
    });

    // Convert SVG to PNG
    const svg = document.getElementById('barcodeSvg');
    const xml = new XMLSerializer().serializeToString(svg);
    const svg64 = btoa(unescape(encodeURIComponent(xml)));
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0);
      const a = document.createElement('a');
      a.download = (name ? name.replace(/\s+/g,'_') + '_' : '') + code + '_barcode.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    };
    img.src = 'data:image/svg+xml;base64,' + svg64;
  }
</script>
</body>
</html>
