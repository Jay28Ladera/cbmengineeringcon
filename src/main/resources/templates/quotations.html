<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotations | CBM Engineering</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/sidebar.css}"><link rel="stylesheet" th:href="@{/css/header.css}"><style>body{margin:0;background:#f4f4f2;font-family:Arial,sans-serif}.app-container{display:flex;min-height:100vh}.main-content{display:flex;flex:1;min-width:0;flex-direction:column;margin-left:280px}.content-area{padding:28px;max-width:1400px;width:100%;margin:auto}.card{border-radius:14px;border:1px solid #e6e6e4}.table td{vertical-align:middle}@media(max-width:900px){.main-content{margin-left:74px}}@media(max-width:600px){.main-content{margin-left:0}}</style></head><body><div class="app-container"><div th:replace="fragments/sidebar :: sidebar(role=${role}, activePage=${activePage})"></div><div class="main-content"><div th:replace="fragments/header :: header(${username})"></div><main class="content-area"><h1 class="fw-bold mb-1">Quotation List</h1><p class="text-muted mb-4">Draft quotations generated from customer inquiries.</p><div class="card"><div class="table-responsive" th:if="${!#lists.isEmpty(quotations)}"><table class="table table-hover mb-0"><thead><tr><th>Quotation No.</th><th>Client</th><th>Project</th><th>Date Created</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="q : ${quotations}"><td th:text="${q.quotationNumber}"></td><td th:text="${q.inquiry.fullName}"></td><td th:text="${q.inquiry.projectName}"></td><td th:text="${#temporals.format(q.createdAt, 'MMM d, yyyy')}"></td><td><span class="badge text-bg-warning" th:text="${q.status}"></span></td><td><a class="btn btn-sm btn-outline-dark" th:href="@{/Quotations/{id}(id=${q.id})}">View Draft</a></td></tr></tbody></table></div><div class="p-5 text-center text-muted" th:if="${#lists.isEmpty(quotations)}">No quotations yet. Create one from an inquiry row.</div></div></main></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script ></script></body></html>
