<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Request an account')}"></head>
<body>
<main class="auth" th:fragment="page">
  <section th:replace="~{fragments/auth :: brand}"></section>

  <section class="auth-panel">
    <div class="auth-card wide">
      <h2>Request an account</h2>
      <p class="lead-text">An administrator reviews every request. You'll receive an email once it's approved.</p>

      <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
      <div th:if="${success}" class="alert alert-success" role="status">
        <span>Request submitted. You can sign in once an administrator approves it.</span>
      </div>

      <form th:action="@{/request-account}" method="post" th:unless="${success}">
        <div class="row g-3 mb-3">
          <div class="col-12"><label class="form-label" for="name">Full name</label><input type="text" id="name" name="name" class="form-control" autocomplete="name" required maxlength="180" th:value="${param.name}" /></div>
          <div class="col-12"><label class="form-label" for="email">Work email</label><input type="email" id="email" name="email" class="form-control" autocomplete="email" required maxlength="180" th:value="${param.email}" /></div>
          <div class="col-sm-6"><label class="form-label" for="username">Username</label><input type="text" id="username" name="username" class="form-control" autocomplete="username" required maxlength="80" th:value="${param.username}" pattern="[A-Za-z0-9._-]{3,80}" title="3 or more letters, numbers, dots, dashes or underscores" /></div>
          <div class="col-sm-6"><label class="form-label" for="role">Requested access</label>
            <select id="role" name="role" class="form-select" required>
              <option value="user" selected>Staff</option>
              <option value="manager">Manager</option>
              <option value="admin">Administrator</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label" for="password">Password</label>
            <div class="password-field">
              <input type="password" id="password" name="password" class="form-control" autocomplete="new-password" minlength="8" required />
              <button class="password-toggle" type="button" aria-label="Show password"><i class="bi bi-eye"></i></button>
            </div>
            <div class="form-hint">At least 8 characters.</div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Submit request</button>
      </form>

      <div class="auth-alt">Already have an account? <a th:href="@{/login}" class="fw-semibold">Sign in</a></div>
    </div>
  </section>
</main>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
