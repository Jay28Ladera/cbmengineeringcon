<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Receiving Report')}"></head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar(role=${role}, activePage=${activePage})}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/header :: header(${username})}"></div>
    <main class="content-area" th:fragment="page" data-section="Inventory" data-title="Receiving Report">
      <div class="page-header">
        <div><div class="page-eyebrow"><a th:href="@{/Inventory/StockReceiving}">Stock receiving</a></div>
          <h1 class="page-title"><span class="mono" th:text="${r.number}"></span> <span th:if="${r.voided}" class="status status-rejected">Voided</span></h1>
          <p class="page-sub"><span th:text="${#temporals.format(r.receivedOn, 'MMMM d, yyyy')}"></span><span th:if="${supplier}" th:text="${' · ' + supplier.name}"></span>
            <span th:if="${po}"> · PO <a class="mono" th:href="@{/Purchasing/Procurements/{id}(id=${po.id})}" th:text="${po.number}"></a></span></p></div>
        <div class="page-actions" th:unless="${r.voided}"><button class="btn btn-ghost" type="button" data-open-dialog="voidDialog"><i class="bi bi-x-circle"></i>Void</button></div>
      </div>
      <div th:if="${success}" class="alert alert-success mb-3" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>
      <div class="alert alert-warning mb-3" th:if="${r.voided}"><span th:text="${'Voided: ' + r.voidReason}"></span></div>
      <section class="panel">
        <div class="panel-body"><dl class="meta-grid">
          <div><dt>DR no.</dt><dd th:text="${r.drNumber ?: '—'}"></dd></div><div><dt>Invoice no.</dt><dd th:text="${r.invoiceNumber ?: '—'}"></dd></div>
          <div><dt>Received by</dt><dd th:text="${r.receivedBy ?: '—'}"></dd></div><div><dt>Entered by</dt><dd th:text="${r.createdBy + ' · ' + #temporals.format(r.createdAt, 'MMM d, h:mm a')}"></dd></div>
        </dl><p class="mb-0" th:if="${r.notes}" th:text="${r.notes}"></p></div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Material</th><th class="num">Qty</th><th class="money">Unit cost</th><th class="money">Amount</th></tr></thead>
          <tbody><tr th:each="l : ${lines}" th:with="m=${materialMap[l.materialId]}">
            <td><a th:href="@{/Inventory/Materials/{id}(id=${l.materialId})}" th:text="${m != null ? m.code + ' · ' + m.name : '?'}"></a></td>
            <td class="num" th:text="${l.qty.stripTrailingZeros().toPlainString() + (m != null ? ' ' + m.unit : '')}"></td>
            <td class="money" th:text="${#numbers.formatDecimal(l.unitCost, 1, 'COMMA', 2, 'POINT')}"></td>
            <td class="money" th:text="${#numbers.formatDecimal(l.amount, 1, 'COMMA', 2, 'POINT')}"></td></tr></tbody>
          <tfoot><tr><td colspan="3" class="text-end fw-semibold">Total</td><td class="money fw-semibold" th:text="${'₱' + #numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></td></tr></tfoot>
        </table></div>
      </section>
      <dialog class="app-dialog app-dialog-sm" id="voidDialog" aria-labelledby="vTitle">
        <form th:action="@{/Inventory/StockReceiving/{id}/void(id=${r.id})}" method="post">
          <header class="dialog-header"><div><h2 id="vTitle">Void this delivery?</h2><p>The quantities are taken back out of stock and off the PO. Not possible if the stock was already used.</p></div><button class="dialog-close" type="button" aria-label="Close" data-close-dialog="voidDialog"><i class="bi bi-x-lg"></i></button></header>
          <div class="dialog-body"><label class="form-label" for="vr">Reason <span class="req">*</span></label><input id="vr" name="reason" class="form-control" maxlength="300" required placeholder="e.g. Entered twice" /></div>
          <footer class="dialog-footer"><button type="button" class="btn btn-ghost" data-close-dialog="voidDialog">Keep it</button><button type="submit" class="btn btn-danger">Void delivery</button></footer>
        </form>
      </dialog>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
