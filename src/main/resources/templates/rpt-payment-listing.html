<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Payment listing')}"></head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar(role=${role}, activePage=${activePage})}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/header :: header(${username})}"></div>
    <main class="content-area" th:fragment="page" data-section="Reports" data-title="Payment listing">
      <div class="page-header">
        <div><div class="page-eyebrow">Reports</div><h1 class="page-title">Payment listing</h1>
          <p class="page-sub">Client payments received in a period, with the tax withheld.</p></div>
        <form class="page-actions d-flex gap-2 align-items-end" method="get">
          <div><label class="form-label small mb-0" for="pf">From</label><input id="pf" type="date" name="from" class="form-control form-control-sm" th:value="${from}" /></div>
          <div><label class="form-label small mb-0" for="pt">To</label><input id="pt" type="date" name="to" class="form-control form-control-sm" th:value="${to}" /></div>
          <button class="btn btn-sm btn-outline" type="submit">Show</button>
          <button class="btn btn-sm btn-ghost" type="button" onclick="window.print()"><i class="bi bi-printer"></i>Print</button>
        </form>
      </div>
      <section class="panel">
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Date</th><th>Receipt</th><th>OR no.</th><th>Job order</th><th>Method</th><th class="money">Settled</th><th class="money">CWT</th><th class="money">Cash in</th></tr></thead>
          <tbody><tr th:each="x : ${rows}" class="row-link" th:classappend="${!x.posted} ? ' row-void'" th:attr="data-href=@{/Accounting/Collections/{id}(id=${x.id})}">
            <td th:text="${#temporals.format(x.receivedDate, 'MMM d, yyyy')}"></td>
            <td><a class="mono" th:href="@{/Accounting/Collections/{id}(id=${x.id})}" th:text="${x.number}"></a></td>
            <td th:text="${x.orNo ?: '—'}"></td>
            <td th:text="${jobMap.get(x.jobOrderId) != null ? jobMap.get(x.jobOrderId).label() : ''}"></td>
            <td th:text="${x.methodLabel + (x.chequeNo != null ? ' #' + x.chequeNo : '')}"></td>
            <td class="money" th:text="${#numbers.formatDecimal(x.applied, 1, 'COMMA', 2, 'POINT')}"></td>
            <td class="money" th:text="${#numbers.formatDecimal(x.cwt, 1, 'COMMA', 2, 'POINT')}"></td>
            <td class="money" th:text="${#numbers.formatDecimal(x.cash, 1, 'COMMA', 2, 'POINT')}"></td></tr></tbody>
          <tfoot><tr class="tb-total"><td colspan="5">Total (excluding voided)</td>
            <td class="money" th:text="${#numbers.formatDecimal(applied, 1, 'COMMA', 2, 'POINT')}"></td>
            <td class="money" th:text="${#numbers.formatDecimal(cwt, 1, 'COMMA', 2, 'POINT')}"></td>
            <td class="money" th:text="${#numbers.formatDecimal(cash, 1, 'COMMA', 2, 'POINT')}"></td></tr></tfoot>
        </table></div>
        <div class="panel-body text-muted small" th:if="${#lists.isEmpty(rows)}">No payments in this period.</div>
      </section>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
