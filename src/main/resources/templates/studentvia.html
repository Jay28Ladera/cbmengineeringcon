<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Via Settings - Sisters of Mary Schools</title>

  <!-- Bootstrap CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css" />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.36/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.36/vfs_fonts.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; margin:0; }

    .app-container { display:flex; min-height:100vh; }
    .main-content { flex:1; display:flex; flex-direction:column; margin-left:280px; transition:margin-left .3s ease; }
    .content-area { flex:1; padding:2rem; background:#f8f9fa; }

    /* When sidebar is collapsed (desktop) */
    #sidebar.sidebar-collapsed ~ .main-content { margin-left:75px; }

    /* Page Header */
    .page-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(102,126,234,.3);
      margin-bottom: 2rem;
    }

    /* Main Content Card */
    .content-card {
      background: #fff;
      border: none;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
      overflow: hidden;
    }

    /* Action Buttons */
    .action-buttons {
      background: #f8f9fa;
      padding: 1.5rem;
      border-bottom: 1px solid #e9ecef;
    }

    .btn-custom {
      border-radius: 10px;
      font-weight: 500;
      padding: 0.6rem 1.5rem;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    .btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0,0,0,.2);
    }

    /* DataTable Styling */
    .dataTables_wrapper {
      padding: 1.5rem;
    }

    .dataTables_length,
    .dataTables_filter,
    .dataTables_info,
    .dataTables_paginate {
      margin: 1rem 0;
    }

    .dataTables_filter input {
      border-radius: 10px;
      border: 2px solid #e9ecef;
      padding: 0.5rem 1rem;
      transition: border-color 0.2s;
    }

    .dataTables_filter input:focus {
      border-color: #667eea;
      outline: none;
      box-shadow: 0 0 0 0.2rem rgba(102,126,234,.25);
    }

    #studentTable {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 15px rgba(0,0,0,.08);
    }

    #studentTable thead th {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      font-weight: 600;
      padding: 1rem;
      text-align: center;
    }

    #studentTable tbody td {
      padding: 1rem;
      border-bottom: 1px solid #e9ecef;
      vertical-align: middle;
      text-align: center;
    }

    #studentTable tbody tr {
      transition: all 0.2s;
    }

    #studentTable tbody tr:hover {
      background-color: #f8f9ff;
      transform: scale(1.01);
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    #studentTable tbody tr:nth-child(even) {
      background-color: #fafbfc;
    }

    /* DataTable Buttons */
    .dt-buttons {
      margin-bottom: 1rem;
    }

    .dt-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
      border: none !important;
      border-radius: 8px !important;
      color: white !important;
      font-weight: 500 !important;
      padding: 0.5rem 1rem !important;
      margin-right: 0.5rem !important;
      margin-bottom: 0.5rem !important;
      transition: all 0.2s !important;
      box-shadow: 0 2px 8px rgba(102,126,234,.3) !important;
    }

    .dt-button:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 4px 15px rgba(102,126,234,.4) !important;
    }

    /* Action Buttons in Table */
    .table-action-btn {
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .table-action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    /* Modal Styling */
    .modal-content {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,.15);
    }

    .modal-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-bottom: none;
      border-radius: 15px 15px 0 0;
    }

    .modal-header .btn-close {
      filter: invert(1);
    }

    .modal-body {
      padding: 2rem;
    }

    .form-control {
      border-radius: 10px;
      border: 2px solid #e9ecef;
      padding: 0.7rem 1rem;
      transition: all 0.2s;
    }

    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102,126,234,.25);
    }

    .form-label {
      font-weight: 500;
      color: #495057;
      margin-bottom: 0.5rem;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .main-content { margin-left: 0 !important; padding-top: 70px; }
      .content-area { padding: 1rem; }
      .page-header .card-body { padding: 1.5rem; }
      .action-buttons { padding: 1rem; }
      .dataTables_wrapper { padding: 1rem; }
      
      .btn-custom {
        width: 100%;
        margin-bottom: 0.5rem;
      }
      
      .dt-button {
        font-size: 0.8rem !important;
        padding: 0.4rem 0.8rem !important;
      }
    }

    @media (max-width: 576px) {
      .content-area { padding: 0.75rem; }
      .page-header .card-body { padding: 1rem; }
    }

    /* Loading Animation */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Success/Error Messages */
    .alert {
      border: none;
      border-radius: 10px;
      font-weight: 500;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <div class="app-container">
    <!-- Sidebar -->
    <div th:replace="fragments/sidebar :: sidebar(role=${role}, activePage='student-via',
                                                 studentInfoExpanded=${studentInfoExpanded},
                                                 asmsiExpanded=${asmsiExpanded},
                                                 admissionExpanded=${admissionExpanded},
                                                 attendanceExpanded=${attendanceExpanded},
                                                 eventsExpanded=${eventsExpanded},
                                                 familyDayExpanded=${familyDayExpanded})"></div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <div th:replace="fragments/header :: header(${username})"></div>

      <!-- Page Body -->
      <main class="content-area">
        <!-- Page Header -->
        <div class="page-header card">
          <div class="card-body">
            <div class="row align-items-center">
              <div class="col-md-8">
                <h2 class="card-title mb-2"><i class="bi bi-geo-alt me-2"></i>Student Via Settings</h2>
                <p class="mb-0">Manage student transportation routes and locations. Add, edit, or delete via entries as needed.</p>
              </div>
              <div class="col-md-4 text-center">
                <i class="bi bi-map" style="font-size:4rem; opacity:.3;"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Main Content Card -->
        <div class="content-card card">
          <!-- Action Buttons -->
          <div class="action-buttons">
            <div class="d-flex flex-wrap gap-2">
              <button type="button" class="btn btn-primary btn-custom" data-bs-toggle="modal" data-bs-target="#addStudentModal">
                <i class="bi bi-plus-circle me-2"></i>Add New Via
              </button>
              
              <form method="POST" action="/upload-via" enctype="multipart/form-data" id="csvUploadForm" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="file" name="file" id="csvFileInput" accept=".csv" required class="d-none" 
                       onchange="showLoading(); document.getElementById('csvUploadForm').submit()" />
                <button type="button" class="btn btn-success btn-custom" onclick="document.getElementById('csvFileInput').click()">
                  <i class="bi bi-upload me-2"></i>Upload CSV
                </button>
              </form>
            </div>
          </div>

          <!-- Via Table -->
          <div class="table-responsive">
            <table class="table table-hover align-middle" id="studentTable">
              <thead>
                <tr>
                  <th><i class="bi bi-geo me-1"></i>Place</th>
                  <th><i class="bi bi-signpost me-1"></i>Via</th>
                  <th><i class="bi bi-gear me-1"></i>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="v : ${vias}">
                  <td>
                    <div class="d-flex align-items-center justify-content-center">
                      <i class="bi bi-geo-alt-fill text-primary me-2"></i>
                      <span th:text="${v.place}"></span>
                    </div>
                  </td>
                  <td>
                    <span class="badge bg-light text-dark fs-6 py-2 px-3" th:text="${v.via}"></span>
                  </td>
                  <td>
                    <div class="d-flex justify-content-center gap-1">
                      <!-- Edit Button -->
                      <button type="button" class="btn btn-warning table-action-btn" 
                              th:attr="data-bs-target='#editModal-' + ${v.id}" data-bs-toggle="modal"
                              title="Edit Via">
                        <i class="bi bi-pencil"></i>
                      </button>

                      <!-- Delete Form -->
                      <form th:action="@{/delete-via}" method="post" class="d-inline">
                        <input type="hidden" name="id" th:value="${v.id}" />
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-danger table-action-btn" 
                                onclick="return confirm('Are you sure you want to delete this via entry?')"
                                title="Delete Via">
                          <i class="bi bi-trash"></i>
                        </button>
                      </form>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Edit Modals for Each Entry -->
        <div th:each="v : ${vias}">
          <div th:id="'editModal-' + ${v.id}" class="modal fade" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <form th:action="@{/edit-via}" method="post">
                  <input type="hidden" name="id" th:value="${v.id}" />
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                  <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-pencil me-2"></i>Edit Via Entry</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>

                  <div class="modal-body">
                    <div class="mb-3">
                      <label class="form-label"><i class="bi bi-geo-alt me-1"></i>Place</label>
                      <input type="text" class="form-control" name="place" th:value="${v.place}" required 
                             placeholder="Enter place name" />
                    </div>
                    <div class="mb-3">
                      <label class="form-label"><i class="bi bi-signpost me-1"></i>Via</label>
                      <input type="text" class="form-control" name="via" th:value="${v.via}" required 
                             placeholder="Enter via route" />
                    </div>
                  </div>

                  <div class="modal-footer">
                    <button type="submit" class="btn btn-primary btn-custom">
                      <i class="bi bi-check-lg me-1"></i>Save Changes
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                      <i class="bi bi-x-lg me-1"></i>Cancel
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <!-- Add Via Modal -->
        <div class="modal fade" id="addStudentModal" tabindex="-1" aria-labelledby="addViaModalLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form th:action="@{/save-via}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <div class="modal-header">
                  <h5 class="modal-title" id="addViaModalLabel"><i class="bi bi-plus-circle me-2"></i>Add New Via</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <div class="modal-body">
                  <div class="mb-3">
                    <label for="place" class="form-label"><i class="bi bi-geo-alt me-1"></i>Place</label>
                    <input type="text" class="form-control" id="place" name="place" required 
                           placeholder="Enter place name" />
                  </div>
                  <div class="mb-3">
                    <label for="via" class="form-label"><i class="bi bi-signpost me-1"></i>Via</label>
                    <input type="text" class="form-control" id="via" name="via" required 
                           placeholder="Enter via route" />
                  </div>
                </div>
                
                <div class="modal-footer">
                  <button type="submit" class="btn btn-primary btn-custom">
                    <i class="bi bi-plus-lg me-1"></i>Add Via
                  </button>
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-lg me-1"></i>Cancel
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- DataTables Init -->
  <script>
    $(document).ready(function () {
      $('#studentTable').DataTable({
        dom: 'Bfrtip',
        buttons: [
          {
            extend: 'copy',
            text: '<i class="bi bi-clipboard me-1"></i>Copy'
          },
          {
            extend: 'csv',
            text: '<i class="bi bi-filetype-csv me-1"></i>CSV'
          },
          {
            extend: 'excel',
            text: '<i class="bi bi-file-earmark-excel me-1"></i>Excel'
          },
          {
            extend: 'pdf',
            text: '<i class="bi bi-filetype-pdf me-1"></i>PDF'
          },
          {
            extend: 'print',
            text: '<i class="bi bi-printer me-1"></i>Print'
          }
        ],
        pageLength: 15,
        responsive: true,
        language: {
          search: "",
          searchPlaceholder: "Search via entries...",
          lengthMenu: "Show _MENU_ entries per page",
          info: "Showing _START_ to _END_ of _TOTAL_ entries",
          paginate: {
            first: "First",
            last: "Last",
            next: "Next",
            previous: "Previous"
          }
        },
        columnDefs: [
          { orderable: false, targets: -1 } // Disable sorting on actions column
        ]
      });

      // Add smooth animations
      $('tr').hover(
        function() { $(this).addClass('table-row-hover'); },
        function() { $(this).removeClass('table-row-hover'); }
      );
    });

    // Loading overlay functions
    function showLoading() {
      document.getElementById('loadingOverlay').style.display = 'flex';
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    // Hide loading on page load
    window.addEventListener('load', hideLoading);

    // Form validation
    document.querySelectorAll('form').forEach(form => {
      form.addEventListener('submit', function(e) {
        const inputs = form.querySelectorAll('input[required]');
        let isValid = true;
        
        inputs.forEach(input => {
          if (!input.value.trim()) {
            isValid = false;
            input.classList.add('is-invalid');
          } else {
            input.classList.remove('is-invalid');
          }
        });
        
        if (!isValid) {
          e.preventDefault();
          alert('Please fill in all required fields.');
        }
      });
    });
  </script>
</body>
</html>
