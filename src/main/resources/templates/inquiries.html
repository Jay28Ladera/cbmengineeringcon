<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inquiries | CBM Engineering</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/sidebar.css}"><link rel="stylesheet" th:href="@{/css/header.css}">
<style>:root{--red:#c9141e;--paper:#f4f4f2}body{margin:0;background:var(--paper);font-family:Arial,sans-serif}.app-container{display:flex;min-height:100vh}.main-content{display:flex;flex:1;min-width:0;flex-direction:column;margin-left:280px}.content-area{padding:28px;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.page-head h1{font-weight:800;margin:0}.card{border:1px solid #e7e7e5;border-radius:14px;box-shadow:0 8px 24px #00000008}.table th{font-size:.8rem;text-transform:uppercase;color:#686868;white-space:nowrap}.table td{vertical-align:middle}.btn-cbm{background:var(--red);color:white;font-weight:700}.btn-cbm:hover{background:#a80e17;color:white}.service-cell{max-width:260px;white-space:normal}.status-badge{background:#fff1dc;color:#795400}.empty{padding:50px 20px;color:#777;text-align:center}@media(max-width:900px){.main-content{margin-left:74px}.content-area{padding:18px}}@media(max-width:600px){.main-content{margin-left:0}.page-head{align-items:flex-start;gap:12px;flex-direction:column}}</style></head>
<body><div class="app-container"><div th:replace="fragments/sidebar :: sidebar(role=${role}, activePage=${activePage})"></div><div class="main-content"><div th:replace="fragments/header :: header(${username})"></div><main class="content-area">
<div class="page-head"><div><h1>Inquiry List</h1><div class="text-muted">Review customer requests and prepare quotations.</div></div><a class="btn btn-cbm" th:href="@{/Clients/new}"><i class="bi bi-plus-lg me-1"></i>Add Inquiry</a></div>
<div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
<div class="card"><div class="table-responsive" th:if="${!#lists.isEmpty(inquiries)}"><table class="table table-hover mb-0"><thead><tr><th>Date</th><th>Contact</th><th>Project</th><th>Services</th><th>Status</th><th class="text-end">Action</th></tr></thead><tbody>
<tr th:each="item : ${inquiries}"><td class="text-nowrap" th:text="${#temporals.format(item.createdAt, 'MMM d, yyyy')}"></td><td><strong th:text="${item.fullName}"></strong><div class="small text-muted" th:text="${item.email}"></div><div class="small text-muted" th:text="${item.phone}"></div></td><td><strong th:text="${item.projectName}"></strong><div class="small text-muted" th:text="${item.projectLocation}"></div></td><td class="service-cell" th:text="${item.servicesNeeded}"></td><td><span class="badge status-badge" th:text="${item.status}"></span></td><td class="text-end"><form th:action="@{/Clients/{id}/quotation(id=${item.id})}" method="post" class="d-inline"><button class="btn btn-sm btn-cbm" type="submit"><i class="bi bi-file-earmark-plus me-1"></i><span th:text="${item.status == 'QUOTATION_CREATED' ? 'Open Quotation' : 'Create Quotation'}"></span></button></form></td></tr>
</tbody></table></div><div class="empty" th:if="${#lists.isEmpty(inquiries)}"><i class="bi bi-inbox fs-1 d-block mb-2"></i><h5>No inquiries yet</h5><p class="mb-3">Add a customer request to start the quotation process.</p><a class="btn btn-cbm" th:href="@{/Clients/new}">Add Inquiry</a></div></div>
</main></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script ></script></body></html>
