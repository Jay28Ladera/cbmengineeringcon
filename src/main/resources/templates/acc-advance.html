<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cash advance')}"></head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar(role=${role}, activePage=${activePage})}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/header :: header(${username})}"></div>
    <main class="content-area" th:fragment="page" data-section="Accounting" data-title="Cash advance">
      <div class="page-header">
        <div><div class="page-eyebrow"><a th:href="@{/Accounting/PettyCash}">Petty cash</a></div>
          <h1 class="page-title"><span class="mono" th:text="${a.number}"></span> <span th:text="${a.employeeName}"></span></h1>
          <p class="page-sub" th:text="${'₱' + #numbers.formatDecimal(a.amount, 1, 'COMMA', 2, 'POINT') + ' from ' + (source != null ? source.name : '') + ' on ' + #temporals.format(a.advanceDate, 'MMM d, yyyy') + ' · ' + a.purpose}"></p></div>
        <div class="page-actions"><button th:if="${a.open and a.replenishmentId == null}" class="btn btn-ghost" type="button" data-open-dialog="caVoid"><i class="bi bi-x-circle"></i>Void</button></div>
      </div>
      <div th:if="${success}" class="alert alert-success mb-3" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>
      <div th:if="${a.overdue}" class="alert alert-warning mb-3" th:text="${'Liquidation was due ' + #temporals.format(a.dueDate, 'MMM d, yyyy') + '.'}"></div>
      <div th:if="${a.status == 'VOID'}" class="alert alert-secondary mb-3" th:text="${'Voided: ' + a.voidReason}"></div>

      <form th:if="${a.open}" th:action="@{/Accounting/PettyCash/advance/{id}/liquidate(id=${a.id})}" method="post" class="panel mb-4" data-ca-form th:attr="data-amount=${a.amount}">
        <div class="panel-header"><h2 class="panel-title"><i class="bi bi-receipt"></i>Liquidate with receipts</h2><button class="btn btn-sm btn-outline" type="button" data-add-row="caLines"><i class="bi bi-plus-lg"></i>Add receipt</button></div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Description</th><th style="width:240px">Account</th><th style="width:200px">Job</th><th style="width:130px">OR no.</th><th class="money" style="width:140px">Amount</th><th style="width:40px"></th></tr></thead>
          <tbody id="caLines"><tr th:each="i : ${#numbers.sequence(1, 3)}">
            <td><input name="r_desc" class="form-control" maxlength="300" /></td>
            <td><select name="r_account" class="form-select"><option th:each="x : ${expenseAccounts}" th:value="${x.id}" th:text="${x.label}" th:selected="${x.code == '5090'}"></option></select></td>
            <td><select name="r_job" class="form-select"><option value="">—</option><option th:each="j : ${jobs}" th:value="${j.id()}" th:text="${j.number()}" th:selected="${a.jobOrderId == j.id()}"></option></select></td>
            <td><input name="r_or" class="form-control" maxlength="60" /></td>
            <td><input name="r_amount" class="form-control text-end" inputmode="decimal" data-ca-amt /></td>
            <td><button class="btn btn-sm btn-ghost btn-icon" type="button" data-remove-row aria-label="Remove"><i class="bi bi-x-lg"></i></button></td></tr></tbody>
        </table></div>
        <div class="panel-body d-flex gap-4 align-items-start">
          <div class="row g-3" style="max-width:480px">
            <div class="col-6"><label class="form-label" for="l1">Cash returned</label><input id="l1" name="returned" class="form-control text-end" inputmode="decimal" data-ca-ret /></div>
            <div class="col-6"><label class="form-label" for="l2">Payroll deduction per cut-off</label><input id="l2" name="perCutoff" class="form-control text-end" inputmode="decimal" placeholder="All at once" /></div>
          </div>
          <div class="acc-totals">
            <div><span>Advance</span><span th:text="${#numbers.formatDecimal(a.amount, 1, 'COMMA', 2, 'POINT')}"></span></div>
            <div><span>Receipts</span><span data-ca="spent">0.00</span></div>
            <div><span>Cash returned</span><span data-ca="ret">0.00</span></div>
            <div class="grand"><span>Deduct from pay</span><span data-ca="left">0.00</span></div>
          </div>
        </div>
        <div class="panel-body border-top d-flex justify-content-end"><button class="btn btn-primary" type="submit"><i class="bi bi-check2-circle"></i>Liquidate</button></div>
      </form>

      <section class="panel" th:unless="${a.open}">
        <div class="panel-body"><dl class="meta-grid">
          <div><dt>Receipts</dt><dd th:text="${'₱' + #numbers.formatDecimal(a.spent, 1, 'COMMA', 2, 'POINT')}"></dd></div>
          <div><dt>Cash returned</dt><dd th:text="${'₱' + #numbers.formatDecimal(a.returned, 1, 'COMMA', 2, 'POINT')}"></dd></div>
          <div><dt>Deducted from pay</dt><dd th:text="${'₱' + #numbers.formatDecimal(a.toPayroll, 1, 'COMMA', 2, 'POINT') + (a.planId != null ? ' (HR › loans and deductions)' : '')}"></dd></div>
          <div th:if="${a.liquidatedAt}"><dt>Liquidated</dt><dd th:text="${a.liquidatedBy + ' · ' + #temporals.format(a.liquidatedAt, 'MMM d, yyyy')}"></dd></div>
        </dl></div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(lines)}"><table class="data-table">
          <thead><tr><th>Receipt</th><th>Account</th><th>Job</th><th>OR no.</th><th class="money">Amount</th></tr></thead>
          <tbody><tr th:each="l : ${lines}"><td th:text="${l.description}"></td><td class="small" th:text="${accountMap.get(l.accountId) != null ? accountMap.get(l.accountId).label : ''}"></td>
            <td th:text="${l.jobOrderId != null and jobMap.get(l.jobOrderId) != null ? jobMap.get(l.jobOrderId).number() : ''}"></td><td th:text="${l.receiptNo ?: '—'}"></td>
            <td class="money" th:text="${#numbers.formatDecimal(l.amount, 1, 'COMMA', 2, 'POINT')}"></td></tr></tbody>
        </table></div>
      </section>
      <dialog class="app-dialog" id="caVoid">
        <form th:action="@{/Accounting/PettyCash/advance/{id}/void(id=${a.id})}" method="post">
          <header class="dialog-header"><div><h2>Void cash advance</h2></div><button class="dialog-close" type="button" aria-label="Close" data-close-dialog="caVoid"><i class="bi bi-x-lg"></i></button></header>
          <div class="dialog-body"><label class="form-label" for="cv">Reason</label><input id="cv" name="reason" class="form-control" required maxlength="300" /></div>
          <footer class="dialog-footer"><button type="button" class="btn btn-ghost" data-close-dialog="caVoid">Keep</button><button type="submit" class="btn btn-danger">Void</button></footer>
        </form>
      </dialog>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
