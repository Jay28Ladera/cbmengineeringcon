<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | Admin System</title>

  <!-- Bootstrap -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

  <!-- Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #eef1f7;
      overflow: hidden;
    }

    .messenger-wrapper {
      height: calc(100vh - 70px);
      display: flex;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      background: white;
    }

    /* SIDEBAR */
    .sidebar {
      width: 320px;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #e5e7eb;
    }

    #userSearch {
      background: #f3f4f6;
      border: none;
      border-radius: 8px;
      padding: .55rem .75rem;
      font-size: .9rem;
    }

    .user-list {
      overflow-y: auto;
      flex: 1;
    }

    .chat-user {
      padding: .75rem .9rem;
      display: flex;
      align-items: center;
      gap: .75rem;
      cursor: pointer;
      transition: background-color .15s;
    }

    .chat-user:hover {
      background: #f3f4f6;
    }

    .chat-user.active {
      background: #e8edff;
    }

    .chat-user img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    .chat-user strong {
      font-size: .95rem;
    }

    .chat-user small {
      font-size: .75rem;
      color: #6b7280;
    }

    /* 🔵 UNREAD STYLE */
    .chat-user.unread {
      background: #e0ecff;
    }

    .chat-user.unread strong {
      color: #2563eb;
      font-weight: 600;
    }

    .chat-user.unread:hover {
      background: #d4e4ff;
    }

    /* CHAT AREA */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fafbfe;
    }

    .chat-area-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 1rem;
      background: white;
    }

    .chat-area-header img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
    }

    #chatMessages {
      flex: 1;
      padding: 1.2rem 1.5rem;
      overflow-y: auto;
    }

    .bubble {
      padding: .6rem .9rem;
      border-radius: 16px;
      margin-bottom: .4rem;
      max-width: 65%;
      font-size: .9rem;
      position: relative;
      word-break: break-word;
    }

    .bubble small {
      display: block;
      font-size: .65rem;
      opacity: .7;
      margin-top: 2px;
    }

    .sent {
      background: #667eea;
      color: white;
      margin-left: auto;
    }

    .received {
      background: #e5e7eb;
      color: #111;
      margin-right: auto;
    }

    .chat-input-area {
      border-top: 1px solid #e5e7eb;
      background: white;
      padding: .6rem .8rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    #chatInput {
      flex: 1;
      border-radius: 12px;
      background: #f3f4f6;
      border: none;
      padding: .7rem 1rem;
      font-size: .9rem;
    }

    #typingIndicator,
    #seenIndicator {
      font-size: .75rem;
      color: #6b7280;
    }

    /* 📱 MOBILE / TABLET LAYOUT */
    #chatBackBtn {
      display: none;
    }

    @media (max-width: 768px) {
      body {
        overflow: auto;
      }

      .messenger-wrapper {
        height: calc(100vh - 60px);
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #e5e7eb;
        height: 100%;
      }

      .chat-area {
        width: 100%;
        height: 100%;
        display: none;          /* hidden by default on mobile */
      }

      #chatBackBtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div th:replace="fragments/header :: header(${username})"></div>

<div class="container-fluid mt-3">
  <div class="messenger-wrapper">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebarPanel">
      <div class="sidebar-header">
        <input type="text" id="userSearch" placeholder="Search users..." class="w-100">
      </div>
      <div id="userList" class="user-list">
        <!-- Dynamic users from model -->
        <div th:each="u : ${users}"
             class="chat-user"
             th:attr="data-username=${u.username}"
             onclick="selectUser(this.getAttribute('data-username'))">
          <img th:src="${u.profileImageUrl != null} ? ${u.profileImageUrl} : '/images/logo.png'">
          <div>
            <strong th:text="${u.username}">user</strong><br>
            <small th:text="${#lists.contains(onlineUsers, u.username) ? 'Online' : 'Offline'}"></small>
          </div>
        </div>
      </div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatPanel">
      <div class="chat-area-header">
        <!-- Back button visible on mobile -->
        <button class="btn btn-link text-secondary me-2"
                id="chatBackBtn"
                type="button">
          <i class="bi bi-arrow-left"></i>
        </button>

        <img src="/images/logo.png" id="selectedUserAvatar" alt="Avatar">
        <div>
          <h6 class="fw-bold mb-0" id="chatWithUser">Select a user</h6>
          <small class="text-muted" id="chatStatus">—</small>
          <div id="typingIndicator"></div>
        </div>
      </div>

      <div id="chatMessages"></div>

      <div class="chat-input-area">
        <button class="btn btn-light btn-sm" type="button" id="emojiBtn">😊</button>
        <input type="text" id="chatInput" placeholder="Write a message..." disabled>
        <button class="btn btn-primary btn-sm" type="button" id="sendBtn">
          <i class="bi bi-send"></i>
        </button>
      </div>
      <div class="px-3 pb-2 d-flex justify-content-end">
        <span id="seenIndicator"></span>
      </div>
    </div>

  </div>
</div>

<!-- WebSocket libs from CDN -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:inline="javascript">
  let stompClient = null;
  let selectedUser = null;

  const currentUser = /*[[${username}]]*/ 'guest';

  // username -> array of Message objects
  const conversationCache = {};

  function log() {
    console.log.apply(console, arguments);
  }

  // Move a user row to the top of the sidebar
  function bumpUserToTop(username) {
    const list = document.getElementById('userList');
    const item = document.querySelector('.chat-user[data-username="' + username + '"]');
    if (list && item) {
      list.insertBefore(item, list.firstChild);
    }
  }

  function connectWS() {
    if (stompClient) {
      log("STOMP already connected or connecting.");
      return;
    }

    log("Connecting WebSocket…");

    const socket = new SockJS(/*[[@{/chat-websocket}]]*/ '/chat-websocket');
    stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, function (frame) {
      log("STOMP connected:", frame);

      // Incoming messages
      stompClient.subscribe('/user/' + currentUser + '/queue/messages', function (message) {
        const body = JSON.parse(message.body);
        log("Received message:", body);

        const peer = (body.from === currentUser) ? body.to : body.from;

        if (!conversationCache[peer]) {
          conversationCache[peer] = [];
        }
        conversationCache[peer].push({
          sender: body.from,
          recipient: body.to,
          content: body.content,
          timestamp: body.timestamp || null,
          seen: false
        });

        // recent conversation -> move that user to top
        bumpUserToTop(peer);

        if (body.from === selectedUser) {
          addMessage(body.content, false, body.timestamp);
        } else if (body.from !== currentUser) {
          const item = document.querySelector('.chat-user[data-username="' + body.from + '"]');
          if (item) {
            item.classList.add('unread');
          }
        }
      });

      // typing indicator
      stompClient.subscribe('/user/' + currentUser + '/queue/typing', function (msg) {
        const body = JSON.parse(msg.body);
        if (body.from === selectedUser) {
          const ti = document.getElementById('typingIndicator');
          ti.innerText = 'Typing...';
          setTimeout(() => { ti.innerText = ''; }, 1500);
        }
      });

      // seen indicator
      stompClient.subscribe('/user/' + currentUser + '/queue/seen', function (msg) {
        const body = JSON.parse(msg.body);
        if (body.from === selectedUser) {
          document.getElementById('seenIndicator').innerText = 'Seen';
        }
      });

    }, function (error) {
      console.error("STOMP error:", error);
      alert("Chat connection error (see console).");
      stompClient = null;
    });
  }

  function renderConversation(messages) {
    const msgArea = document.getElementById('chatMessages');
    msgArea.innerHTML = '';

    messages.forEach(m => {
      const isOwn = (m.sender === currentUser);
      const ts = m.timestamp
        ? ('' + m.timestamp).replace('T', ' ').substring(0, 16)
        : '';
      addMessage(m.content, isOwn, ts);
    });
  }

  // MOBILE: show chat, hide list
  function openChatMobile() {
    if (window.innerWidth <= 768) {
      const sidebar = document.getElementById('sidebarPanel');
      const chatArea = document.getElementById('chatPanel');
      sidebar.style.display = 'none';
      chatArea.style.display = 'flex';
    }
  }

  // MOBILE: back to list
  function showSidebarMobile() {
    if (window.innerWidth <= 768) {
      const sidebar = document.getElementById('sidebarPanel');
      const chatArea = document.getElementById('chatPanel');
      sidebar.style.display = 'flex';
      chatArea.style.display = 'none';
    }
  }

  // GLOBAL: called from HTML onclick
  function selectUser(username) {
    selectedUser = username;
    log("selectUser:", username);

    document.getElementById('chatWithUser').innerText = username;
    document.getElementById('chatStatus').innerText = 'Active now';
    document.getElementById('chatInput').disabled = false;
    document.getElementById('chatInput').focus();
    document.getElementById('seenIndicator').innerText = '';

    // highlight active user, clear unread style
    document.querySelectorAll('.chat-user').forEach(el => el.classList.remove('active'));
    const activeEl = document.querySelector('.chat-user[data-username="' + username + '"]');
    if (activeEl) {
      activeEl.classList.add('active');
      activeEl.classList.remove('unread');
    }

    const msgArea = document.getElementById('chatMessages');

    if (conversationCache[username] && conversationCache[username].length > 0) {
      renderConversation(conversationCache[username]);
    } else {
      msgArea.innerHTML =
        '<div class="text-center text-muted mt-3" style="font-size:.85rem;">Loading messages…</div>';
    }

    const url = '/messages/history/' + encodeURIComponent(username);
    log("Fetching history from:", url);

    fetch(url)
      .then(res => res.json())
      .then(history => {
        log("History for", username, "=>", history);

        if (!Array.isArray(history)) {
          console.error("History is not an array:", history);
          return;
        }

        conversationCache[username] = history;

        if (selectedUser === username) {
          renderConversation(history);
        }

        if (stompClient && stompClient.connected) {
          stompClient.send("/app/chat.seen", {}, JSON.stringify({
            from: currentUser,
            to: selectedUser
          }));
        }
      })
      .catch(err => console.error("History error:", err));

    openChatMobile();
  }

  function addMessage(text, isOwn, timestamp) {
    const msgArea = document.getElementById('chatMessages');
    const bubble = document.createElement('div');
    bubble.classList.add('bubble', isOwn ? 'sent' : 'received');
    bubble.innerText = text;

    if (timestamp) {
      const ts = document.createElement('small');
      ts.innerText = timestamp;
      bubble.appendChild(ts);
    }

    msgArea.appendChild(bubble);
    msgArea.scrollTop = msgArea.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();

    if (!selectedUser) {
      alert("Please select a user first.");
      return;
    }
    if (!text) return;

    if (!stompClient || !stompClient.connected) {
      console.error("STOMP not connected, cannot send.");
      alert("Chat not connected yet. Wait a bit and try again.");
      return;
    }

    const msgObj = {
      from: currentUser,
      to: selectedUser,
      content: text,
      timestamp: ''
    };

    log("Sending message:", msgObj);

    stompClient.send("/app/chat.private", {}, JSON.stringify(msgObj));

    if (!conversationCache[selectedUser]) {
      conversationCache[selectedUser] = [];
    }
    conversationCache[selectedUser].push({
      sender: currentUser,
      recipient: selectedUser,
      content: text,
      timestamp: 'Now',
      seen: true
    });

    addMessage(text, true, 'Now');
    input.value = '';
    document.getElementById('seenIndicator').innerText = '';

    bumpUserToTop(selectedUser);
  }

  function insertEmoji(emoji) {
    const input = document.getElementById('chatInput');
    input.value += emoji;
    input.focus();
  }

  // initial load: sort users by last-message and fill cache
  function loadInitialOrderByHistory() {
    const list = document.getElementById('userList');
    if (!list) return;

    const items = Array.from(document.querySelectorAll('.chat-user'));
    if (items.length === 0) return;

    const msgArea = document.getElementById('chatMessages');
    if (msgArea) {
      msgArea.innerHTML =
        '<div class="text-center text-muted mt-3" style="font-size:.85rem;">Loading conversations…</div>';
    }

    const promises = items.map(el => {
      const uname = el.getAttribute('data-username');
      const url = '/messages/history/' + encodeURIComponent(uname);
      return fetch(url)
        .then(res => res.json())
        .then(history => {
          if (Array.isArray(history)) {
            conversationCache[uname] = history;
          }
          let lastTs = null;
          if (Array.isArray(history) && history.length > 0) {
            const last = history[history.length - 1];
            lastTs = last.timestamp || null;
          }
          return { el, uname, lastTs };
        })
        .catch(() => ({ el, uname, lastTs: null }));
    });

    Promise.all(promises).then(results => {
      results.sort((a, b) => {
        if (!a.lastTs && !b.lastTs) return 0;
        if (!a.lastTs) return 1;
        if (!b.lastTs) return -1;
        return new Date(b.lastTs) - new Date(a.lastTs);
      });

      results.forEach(r => list.appendChild(r.el));

      if (window.innerWidth > 768) {
        const firstWithHistory = results.find(r => r.lastTs);
        const first = firstWithHistory || results[0];
        if (first) {
          selectUser(first.uname);
        }
      } else {
        // mobile: start with list only
        const sidebar = document.getElementById('sidebarPanel');
        const chatArea = document.getElementById('chatPanel');
        sidebar.style.display = 'flex';
        chatArea.style.display = 'none';
        msgArea.innerHTML =
          '<div class="text-center text-muted mt-3" style="font-size:.85rem;">Select a user to start chatting</div>';
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    connectWS();

    const chatInput = document.getElementById('chatInput');
    const sendBtn   = document.getElementById('sendBtn');
    const emojiBtn  = document.getElementById('emojiBtn');
    const backBtn   = document.getElementById('chatBackBtn');

    if (chatInput) {
      chatInput.addEventListener('keydown', function (e) {
        if (!selectedUser) return;

        if (e.key === 'Enter') {
          sendMessage();
        } else {
          if (stompClient && stompClient.connected) {
            stompClient.send("/app/chat.typing", {}, JSON.stringify({
              from: currentUser,
              to: selectedUser
            }));
          }
        }
      });
    }

    if (sendBtn) {
      sendBtn.addEventListener('click', function () {
        sendMessage();
      });
    }

    if (emojiBtn) {
      emojiBtn.addEventListener('click', function () {
        insertEmoji('😊');
      });
    }

    if (backBtn) {
      backBtn.addEventListener('click', function () {
        showSidebarMobile();
      });
    }

    const search = document.getElementById('userSearch');
    if (search) {
      search.addEventListener('input', function () {
        const q = this.value.toLowerCase();
        document.querySelectorAll('.chat-user').forEach(el => {
          const uname = el.getAttribute('data-username').toLowerCase();
          el.style.display = uname.includes(q) ? '' : 'none';
        });
      });
    }

    // on resize: if going back to desktop, show both panels
    window.addEventListener('resize', function () {
      const sidebar = document.getElementById('sidebarPanel');
      const chatArea = document.getElementById('chatPanel');
      if (window.innerWidth > 768) {
        sidebar.style.display = 'flex';
        chatArea.style.display = 'flex';
      } else {
        // small screen: if no user selected, show only list
        if (!selectedUser) {
          sidebar.style.display = 'flex';
          chatArea.style.display = 'none';
        }
      }
    });

    loadInitialOrderByHistory();
  });
</script>

</body>
</html>
