<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset password')}"></head>
<body>
<main class="auth" th:fragment="page">
  <section th:replace="~{fragments/auth :: brand}"></section>

  <section class="auth-panel">
    <div class="auth-card">
      <h2>Choose a new password</h2>
      <p class="lead-text">Use at least 8 characters. The reset link can be used once.</p>

      <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

      <form th:if="${token}" th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}" />
        <div class="field">
          <label class="form-label" for="password">New password</label>
          <div class="password-field">
            <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" required autofocus />
            <button class="password-toggle" type="button" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="field">
          <label class="form-label" for="confirmPassword">Confirm new password</label>
          <div class="password-field">
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required data-match="password" />
            <button class="password-toggle" type="button" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Reset password</button>
      </form>

      <a th:unless="${token}" class="btn btn-dark btn-block" th:href="@{/forget-password}">Request a new link</a>
      <div class="auth-alt"><a th:href="@{/login}" class="fw-semibold"><i class="bi bi-arrow-left me-1"></i>Back to sign in</a></div>
    </div>
  </section>
</main>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
