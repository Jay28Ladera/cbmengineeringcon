<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar(role=${role}, activePage='profile')}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/header :: header(${username})}"></div>

    <main class="content-area content-narrow" th:fragment="page" data-section="Account" data-title="My Profile">
      <div class="page-header">
        <div>
          <div class="page-eyebrow">Account</div>
          <h1 class="page-title">My profile</h1>
          <p class="page-sub">Your sign-in details and photo. Leave the password fields blank to keep your current password.</p>
        </div>
      </div>

      <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>
      <div th:if="${success}" class="alert alert-success mb-3" th:text="${success}"></div>

      <form class="panel profile-card" th:action="@{/profile/update}" enctype="multipart/form-data" method="post">
        <div class="profile-side">
          <div class="profile-photo">
            <img id="profileImagePreview" th:if="${profileImageUrl != null}" th:src="${profileImageUrl}" alt="Profile photo" />
            <span id="profileInitials" class="avatar" th:if="${profileImageUrl == null}" th:text="${userInitials}">CB</span>
            <label for="profileImage" title="Change photo"><i class="bi bi-camera"></i></label>
          </div>
          <input type="file" id="profileImage" name="profileImage" accept="image/png,image/jpeg,image/webp" class="d-none"
                 onchange="(function(i){var f=i.files&&i.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){var p=document.getElementById('profileImagePreview');if(!p){p=document.createElement('img');p.id='profileImagePreview';p.alt='Profile photo';var s=document.getElementById('profileInitials');s.replaceWith(p);}p.src=e.target.result;};r.readAsDataURL(f);})(this)" />
          <div class="fw-semibold" th:text="${displayName}">Name</div>
          <div class="text-muted small mono" th:text="${'@' + username}">@user</div>
          <div class="mt-2"><span class="status" th:text="${role}">user</span></div>
          <div class="form-hint mt-3">JPG, PNG or WebP · up to 2 MB</div>
        </div>

        <div class="panel-body p-4">
          <section class="form-section">
            <h2 class="form-section-title"><span class="no">01</span>Profile information</h2>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label" for="fullName">Full name</label><input id="fullName" type="text" class="form-control" name="fullName" th:value="${fullName}" required maxlength="180" /></div>
              <div class="col-md-6"><label class="form-label" for="username">Username</label><input id="username" type="text" class="form-control" name="username" th:value="${username}" required maxlength="80" autocomplete="username" /></div>
              <div class="col-md-6"><label class="form-label" for="email">Email</label><input id="email" type="email" class="form-control" name="email" th:value="${email}" required maxlength="180" /></div>
              <div class="col-md-6"><label class="form-label" for="phone">Phone</label><input id="phone" type="tel" class="form-control" name="phone" th:value="${phone}" maxlength="40" /></div>
            </div>
          </section>

          <section class="form-section">
            <h2 class="form-section-title"><span class="no">02</span>Change password</h2>
            <div class="row g-3">
              <div class="col-12"><label class="form-label" for="currentPassword">Current password</label><input id="currentPassword" type="password" class="form-control" name="currentPassword" autocomplete="current-password" /></div>
              <div class="col-md-6"><label class="form-label" for="newPassword">New password</label><input id="newPassword" type="password" class="form-control" name="newPassword" minlength="8" autocomplete="new-password" /></div>
              <div class="col-md-6"><label class="form-label" for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" class="form-control" name="confirmPassword" minlength="8" autocomplete="new-password" /></div>
            </div>
          </section>

          <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/home}" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i>Save changes</button>
          </div>
        </div>
      </form>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
