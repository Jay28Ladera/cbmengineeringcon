<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Sisters of Mary Admin</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />

  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" 
        rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f3f4f6;
    }
    .content-area {
      padding: 2rem;
    }
    .profile-card {
      border-radius: 16px;
      border: 0;
      box-shadow: 0 10px 40px rgba(0,0,0,.05);
    }
    .section-title {
      font-size: .8rem;
      font-weight: 700;
      color: #6b7280;
      letter-spacing: .05rem;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div th:replace="fragments/header :: header(${username})"></div>

<!-- MAIN CONTENT -->
<main class="content-area">
  <div class="container">

    <!-- Page Title -->
    <div class="mb-4">
      <h2 class="fw-bold mb-0">My Profile</h2>
      <div class="text-muted">Manage your account information and security</div>
    </div>

    <!-- Status Messages -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- Profile Card -->
    <div class="card profile-card mb-4">
      <div class="card-body p-4">

        <form th:action="@{/profile/update}" enctype="multipart/form-data" method="post">
          <input type="hidden" name="_csrf" th:value="${_csrf.token}" />

          <div class="row g-4">

            <!-- LEFT PANEL: Avatar -->
            <div class="col-md-4 border-end">
              <div class="d-flex flex-column align-items-center text-center">

                <!-- Profile Image -->
                <div class="position-relative mb-3">
                 <img id="profileImagePreview"
     th:src="${profileImageUrl != null} ? ${profileImageUrl} : '/images/logo.png'"
     src="/images/logo.png"
     class="rounded-circle border"
     style="width:140px;height:140px;object-fit:cover;border:4px solid #e5e7eb;"
     alt="Profile Picture">

                  <label for="profileImage"
                         class="btn btn-sm btn-primary position-absolute bottom-0 end-0 rounded-pill shadow"
                         style="font-size:.75rem;">
                    <i class="bi bi-camera"></i>
                  </label>
                </div>

                <input type="file" id="profileImage" name="profileImage" accept="image/*"
                       class="d-none" onchange="previewProfileImage(event)" />

                <p class="fw-semibold mb-0" th:text="${displayName}">John Doe</p>
                <small class="text-muted" th:text="${username}">@johndoe</small>
                <small class="text-muted mt-2">JPG or PNG • Max 2 MB</small>
              </div>
            </div>

            <!-- RIGHT PANEL -->
            <div class="col-md-8">

              <!-- Profile Information -->
              <div class="mb-3"><span class="section-title">Profile Information</span></div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label class="text-muted small">Full Name</label>
                  <input type="text" class="form-control form-control-sm"
                         name="fullName" th:value="${fullName}" placeholder="Full Name">
                </div>

                <div class="col-md-6">
                  <label class="text-muted small">Username</label>
                  <input type="text" class="form-control form-control-sm"
                         name="username" th:value="${username}" placeholder="Username">
                </div>

                <div class="col-md-6">
                  <label class="text-muted small">Email</label>
                  <input type="email" class="form-control form-control-sm"
                         name="email" th:value="${email}" placeholder="Email Address">
                </div>

                <div class="col-md-6">
                  <label class="text-muted small">Phone</label>
                  <input type="text" class="form-control form-control-sm"
                         name="phone" th:value="${phone}" placeholder="Phone Number">
                </div>
              </div>

              <hr class="my-4">

              <!-- Security -->
              <div class="mb-3"><span class="section-title">Security</span></div>

              <div class="row g-3 mb-4">
                <div class="col-12">
                  <label class="text-muted small">Current Password</label>
                  <input type="password" class="form-control form-control-sm"
                         name="currentPassword" placeholder="Enter current password">
                </div>

                <div class="col-md-6">
                  <label class="text-muted small">New Password</label>
                  <input type="password" class="form-control form-control-sm"
                         name="newPassword" placeholder="Enter new password">
                </div>

                <div class="col-md-6">
                  <label class="text-muted small">Confirm Password</label>
                  <input type="password" class="form-control form-control-sm"
                         name="confirmPassword" placeholder="Confirm new password">
                </div>

                <small class="text-muted mt-2">
                  Leave password fields blank if you do not want to change it.
                </small>
              </div>

              <!-- Buttons -->
              <div class="d-flex justify-content-end gap-2 mt-4">
                <a th:href="@{/home}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                <button type="submit" class="btn btn-primary btn-sm">
                  <i class="bi bi-save me-1"></i>Save Changes
                </button>
              </div>

            </div>

          </div>
        </form>

      </div>
    </div>

  </div>
</main>

<!-- Bootstrap Bundle (JS + Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Image preview script -->
<script>
  function previewProfileImage(event) {
    const input = event.target;
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('profileImagePreview').src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }
  }
</script>

</body>
</html>
