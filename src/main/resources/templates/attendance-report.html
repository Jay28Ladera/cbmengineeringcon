<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <title>Attendance Report - Sisters of Mary Schools</title>

  <!-- Bootstrap CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css" />

  <!-- jQuery (required by DataTables) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; margin:0; }
    .app-container { display:flex; min-height:100vh; }
    .main-content { flex:1; display:flex; flex-direction:column; margin-left:280px; transition:margin-left .3s ease; }
    .content-area { flex:1; padding:2rem; background:#f8f9fa; }
    #sidebar.sidebar-collapsed ~ .main-content { margin-left:75px; }

    .page-header { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:#fff; border:none; border-radius:15px; box-shadow:0 10px 30px rgba(102,126,234,.3); margin-bottom: 2rem; }
    .report-card { border-radius: 12px; box-shadow:0 6px 24px rgba(0,0,0,0.08); background:#fff; padding:1.25rem; }
    .stat { font-weight:700; font-size:1.5rem; }

    .dataTables_wrapper { font-family: 'Inter', sans-serif; }
    .dataTables_wrapper .dataTables_length select,
    .dataTables_wrapper .dataTables_filter input { border: 2px solid #e9ecef; border-radius: 6px; padding: 0.5rem; }
    .dt-button { background: linear-gradient(135deg, #6c757d 0%, #495057 100%) !important; border: none !important; color: white !important; padding: 0.5rem 1rem !important; border-radius: 6px !important; margin-right: 0.5rem !important; }
    .table thead th { background: linear-gradient(135deg, #3254eb 0%, #3658f1 100%); color: #fff; border: none; }

    #sidebar { transform: translateX(0); transition: transform .25s ease; }
    @media (max-width: 768px){
      .main-content { margin-left:0 !important; padding-top:70px; }
      .content-area { padding:1rem; }
      #sidebar { transform: translateX(-100%); width: 260px; }
      #sidebar.show { transform: translateX(0); box-shadow: 0 0 0 9999px rgba(0,0,0,.35); }
    }

    /* Right card makes list look nice */
    .list-group-item small { color:#6c757d; }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- Sidebar -->
    <div th:replace="fragments/sidebar :: sidebar(role=${role}, activePage='attendance-report',
                                                 studentInfoExpanded=${studentInfoExpanded},
                                                 asmsiExpanded=${asmsiExpanded},
                                                 admissionExpanded=${admissionExpanded},
                                                 attendanceExpanded=${attendanceExpanded},
                                                 eventsExpanded=${eventsExpanded},
                                                 familyDayExpanded=${familyDayExpanded})"></div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <div th:replace="fragments/header :: header(${username})"></div>

      <main class="content-area">
        <div class="page-header card mb-4">
          <div class="card-body">
            <div class="row align-items-center">
              <div class="col-md-8">
                <h2 class="card-title mb-2"><i class="bi bi-bar-chart-line-fill me-2"></i>Library Attendance Report</h2>
                <p class="mb-0">Filtered attendance analytics — follows the Reports styling and layout.</p>
              </div>
              <div class="col-md-4 text-center">
                <i class="bi bi-table" style="font-size:4rem; opacity:.3;"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Filters -->
        <div class="row g-3 mb-3">
          <div class="col-md-3">
            <label class="form-label">From</label>
            <input type="date" id="from-date" class="form-control" />
          </div>
          <div class="col-md-3">
            <label class="form-label">To</label>
            <input type="date" id="to-date" class="form-control" />
          </div>
          <div class="col-md-3">
  <label class="form-label">Recorded By / Account</label>
  <select id="account" class="form-select">
    <option value="">All</option>
  </select>
</div>

          <div class="col-md-3 d-flex align-items-end gap-2">
            <button id="btn-run" class="btn btn-primary"><i class="bi bi-funnel-fill me-1"></i>Run Report</button>
            <button id="btn-export-csv" class="btn btn-outline-secondary"><i class="bi bi-file-earmark-csv me-1"></i>Export CSV</button>
          </div>
        </div>

        <!-- Summary cards -->
        <div class="report-card mb-3">
          <div class="row align-items-center">
            <div class="col-md-3 text-center">
              <div class="text-muted">Total Records</div>
              <div id="stat-total" class="stat">-</div>
            </div>
            <div class="col-md-3 text-center">
              <div class="text-muted">Present</div>
              <div id="stat-present" class="stat text-success">-</div>
            </div>
            <div class="col-md-3 text-center">
              <div class="text-muted">Absent</div>
              <div id="stat-absent" class="stat text-danger">-</div>
            </div>
            <div class="col-md-3 text-center">
              <div class="text-muted">Unique Students</div>
              <div id="stat-unique" class="stat">-</div>
            </div>
          </div>
        </div>

        <!-- SIDE BY SIDE: Table (left) & Top 10 (right) -->
        <div class="row gy-3">
          <!-- Left: Detailed Records Table -->
          <div class="col-lg-8">
            <div class="report-card">
              <h6 class="mb-3">Detailed Records</h6>
              <div class="table-responsive">
                <table id="reportTable" class="table table-hover align-middle" style="width:100%">
                  <thead>
                    <tr>
                      <th>Photo</th>
                      <th>Name</th>
                      <th>ID Number</th>
                      <th>Date</th>
                      <th>Time In</th>
                      <th>Time Out</th>
                      <th>Status</th>
                      <th>Recorded By</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Right: Top Students -->
          <div class="col-lg-4">
            <div class="report-card">
              <h6 class="mb-3">Top 10 Students (by records)</h6>
              <ol id="top-students" class="list-group list-group-numbered">
                <!-- filled by JS -->
              </ol>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- DataTables + Buttons -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

  <!-- Report logic (no chart) -->
 <script th:inline="none">
  let reportTable = null;
  let latestData = null;

  function toCSV(rows) {
    const header = ['name','idNumber','date','timeIn','timeOut','status','account'];
    const csv = [header.join(',')]
      .concat(rows.map(r => header.map(h => '"' + (r[h] || '') + '"').join(',')))
      .join('\n');
    return csv;
  }

  // NEW: load distinct accounts for the dropdown
  async function loadAccounts() {
    try {
      const res = await fetch('/api/attendance/accounts');
      if (!res.ok) return; // silent fail; leave only "All"
      const items = await res.json();   // array of strings
      const sel = document.getElementById('account');

      // Clear any previously-added items but keep the first "All"
      [...sel.querySelectorAll('option:not(:first-child)')].forEach(o => o.remove());

      items.forEach(acc => {
        const opt = document.createElement('option');
        opt.value = acc;
        opt.textContent = acc;
        sel.appendChild(opt);
      });
    } catch (e) {
      console.warn('Failed to load accounts', e);
    }
  }

  async function runReport() {
    const from = document.getElementById('from-date').value;
    const to = document.getElementById('to-date').value;
    const account = document.getElementById('account').value.trim();

    if (!from || !to) { alert('Please choose both From and To dates.'); return; }

    const q = new URLSearchParams({ from, to, account }).toString();
    const res = await fetch('/api/attendance/report?' + q);
    if (!res.ok) { alert('Failed to fetch report'); return; }

    const payload = await res.json();
    latestData = payload;

    // Summary
    document.getElementById('stat-total').textContent   = payload.summary.total;
    document.getElementById('stat-present').textContent = payload.summary.present;
    document.getElementById('stat-absent').textContent  = payload.summary.absent;
    document.getElementById('stat-unique').textContent  = payload.summary.uniqueStudents;

    // Right: Top students
    const top = payload.topStudents || [];
    const list = document.getElementById('top-students');
    list.innerHTML = '';
    top.slice(0,10).forEach(s => {
      const li = document.createElement('li');
      li.className = 'list-group-item d-flex justify-content-between align-items-center';
      li.innerHTML = `<span>${s.name}</span><span class="badge bg-secondary rounded-pill">${s.count}</span>`;
      list.appendChild(li);
    });

    // Left: Table rows
    const tbody = document.querySelector('#reportTable tbody');
    tbody.innerHTML = '';
    const fragment = document.createDocumentFragment();
    (payload.records || []).forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><img src="${r.imageUrl || '/images/default-profile.png'}" alt="photo"
                 style="width:48px;height:48px;border-radius:50%;object-fit:cover"/></td>
        <td>${r.name || '-'}</td>
        <td><code>${r.idNumber || '-'}</code></td>
        <td>${r.date || '-'}</td>
        <td>${r.timeIn || '-'}</td>
        <td>${r.timeOut || '-'}</td>
        <td>${r.status || '-'}</td>
        <td>${r.account || '-'}</td>
      `;
      fragment.appendChild(tr);
    });
    tbody.appendChild(fragment);

    // (Re)initialize DataTable
    if (reportTable) { reportTable.destroy(); }
    reportTable = $('#reportTable').DataTable({
      dom: 'Bfrtip',
      buttons: ['copyHtml5','excelHtml5','csvHtml5','pdfHtml5','print'],
      pageLength: 25,
      order: [[3, 'desc'], [4, 'desc']]
    });
  }

  // Button handlers
  document.getElementById('btn-run').addEventListener('click', runReport);
  document.getElementById('btn-export-csv').addEventListener('click', function(){
    if (!latestData) return alert('Run the report first');
    const csv = toCSV(latestData.records || []);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `attendance_report_${document.getElementById('from-date').value}_to_${document.getElementById('to-date').value}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  // Auto-run when the account selection changes
  document.getElementById('account').addEventListener('change', runReport);

  // Default date range + load dropdown on page load
  (function init(){
    const to = new Date();
    const from = new Date(); from.setDate(to.getDate() - 6);
    const fmt = d => d.toISOString().slice(0,10);
    document.getElementById('from-date').value = fmt(from);
    document.getElementById('to-date').value   = fmt(to);

    loadAccounts();     // populate dropdown
    // Optionally fetch immediately:
    // runReport();
  })();
</script>

</body>
</html>
