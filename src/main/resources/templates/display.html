<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Day – Student Logs by Batch</title>

  <!-- Bootstrap & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"/>

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>

    .live-indicator {
  display: inline-flex;
  align-items: center;
  font-size: 0.85rem;
  font-weight: 800;
  color: #dc2626; /* red text */
  background: #fee2e2; /* light red bg */
  border: 1px solid #fecaca;
  border-radius: 999px;
  padding: 0.2rem 0.6rem;
}

.live-indicator .dot {
  width: 8px;
  height: 8px;
  margin-right: 6px;
  border-radius: 50%;
  background: #dc2626;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%   { opacity: 1; transform: scale(1); }
  50%  { opacity: 0.4; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1); }
}

    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#334155;overflow-x:hidden}
    .app-container{display:flex;min-height:100vh}
    .main-content{flex:1;display:flex;flex-direction:column;margin-left:280px;transition:margin-left .3s}
    #sidebar.sidebar-collapsed ~ .main-content{margin-left:75px}

    .content-area{flex:1;padding:2rem}
    .page-title{font-weight:800;letter-spacing:-.02em;margin-bottom:1rem}
    .page-title .grad{
      background:linear-gradient(135deg,#4169e1 0%,#6366f1 100%);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent
    }

    .time-date-display{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1rem 1.25rem}

    /* ==== Batch grid (cards side-by-side) - FIXED FOR 5 COLUMNS ==== */
    .batches-grid{
      display:grid;
      grid-template-columns: repeat(5, 1fr); /* Exactly 5 equal columns */
      gap: 16px; /* Reduced gap to fit 5 columns comfortably */
      align-items:start;
      width: 100%; /* Ensure full width usage */
    }

    .batch-card{
      border:1px solid #e2e8f0;
      border-radius:16px;
      background:#fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transition: transform 0.2s ease;
      min-width: 0; /* Allow cards to shrink below their content width */
    }
    
    .batch-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }
    
    .batch-card .card-header{
      background: linear-gradient(135deg, #b8c9ff 0%, #e0e7ff 100%);
      border-bottom:1px solid #e2e8f0;
      border-top-left-radius:16px;
      border-top-right-radius:16px;
      display:flex;align-items:center;justify-content:space-between;
      padding:1.2rem 1rem; /* Reduced padding for tighter fit */
      margin-top: 50px;
    }
    
    .batch-title{
      font-weight:900;
      color:#4169e1;
      margin:0;
      font-size: 1.6rem; /* Slightly smaller for better fit */
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .badge-soft{
      background:#4169e1;
      color:#fff;
      border:none;
      font-weight:700;
      font-size: 0.75rem; /* Smaller badge text */
      padding: 0.3rem 0.6rem;
      white-space: nowrap;
    }

    .table-wrap{
      border-top:1px solid #e2e8f0;
      border-bottom-left-radius:16px;
      border-bottom-right-radius:16px;
      overflow: hidden;
    }
    
    .table thead th{
      background:#4169e1;
      color:#fff;
      font-weight: 700;
      font-size: 0.8rem; /* Smaller header text */
      padding: 0.8rem 0.5rem; /* Reduced padding */
      border: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    /* Enhanced table styling with responsive text */
    .table-sm td, .table-sm th{
      padding: 1rem 0.8rem; /* Reduced padding */
      font-size: 1rem; /* Slightly smaller base font */
      font-weight: 600;
      border-color: #f1f5f9;
    }
    
    /* Regular rows */
    .table tbody tr {
      transition: all 0.3s ease;
    }
    
    .table tbody tr:hover {
      background: #f8fafc;
      transform: scale(1.01); /* Reduced scale for tighter space */
    }
    
    /* FEATURED FIRST ROW - Clean blue highlighting */
    .table tbody tr.featured-row {
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 50%, #93c5fd 100%) !important;
      border: 3px solid #3b82f6 !important;
      transform: scale(1.01);
      box-shadow: 
        0 4px 25px rgba(59, 130, 246, 0.3),
        0 2px 10px rgba(59, 130, 246, 0.2);
      position: relative;
      z-index: 10;
      animation: blueGlow 3s ease-in-out infinite alternate;
    }
    
    @keyframes blueGlow {
      0% { 
        background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 50%, #93c5fd 100%) !important;
        box-shadow: 
          0 4px 25px rgba(59, 130, 246, 0.3),
          0 2px 10px rgba(59, 130, 246, 0.2);
      }
      100% { 
        background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #bfdbfe 100%) !important;
        box-shadow: 
          0 6px 30px rgba(59, 130, 246, 0.4),
          0 3px 15px rgba(59, 130, 246, 0.3);
      }
    }
    
    .table tbody tr.featured-row:hover {
      animation-play-state: paused;
      transform: scale(1.02) !important;
      box-shadow: 
        0 8px 35px rgba(59, 130, 246, 0.4),
        0 4px 20px rgba(59, 130, 246, 0.3) !important;
    }
    
    .table tbody tr.featured-row td {
      padding: 1.4rem 1rem !important; /* Reduced padding */
      font-size: 1.3rem !important; /* Smaller featured text */
      font-weight: 800 !important;
      color: #1e40af !important;
      border-color: #3b82f6 !important;
      line-height: 1.3 !important;
    }
    
    /* Featured row image with adjusted size */
    .table tbody tr.featured-row .log-img {
      width: 60px !important; /* Smaller image */
      height: 60px !important;
      border: 4px solid #3b82f6 !important;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3) !important;
    }
    
    .table tbody tr.featured-row td:first-child {
      position: relative;
    }
    
    /* Regular rows enhanced styling */
    .col-photo{width:80px} /* Slightly smaller photo column */
    .log-img{
      width:50px; /* Smaller regular images */
      height:50px;
      object-fit:cover;
      border-radius:15px;
      border: 3px solid #e2e8f0;
      transition: all 0.3s ease;
    }
    
    .table tbody tr:hover .log-img {
      border-color: #4169e1;
      transform: scale(1.1);
    }

    /* Enhanced name styling with responsive text */
    .table tbody td:nth-child(2) {
      font-weight: 700;
      color: #1e293b;
      font-size: 1.1rem !important; /* Responsive text size */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    /* Time column responsive text */
    .table tbody td:nth-child(3) {
      font-size: 1rem !important;
      font-weight: 600;
      color: #4169e1;
      white-space: nowrap;
    }
    
    .table tbody tr.featured-row td:nth-child(2) {
      font-weight: 800 !important;
      font-size: 1.5rem !important; /* Adjusted featured name size */
      color: #1e40af !important;
    }
    
    .table tbody tr.featured-row td:nth-child(3) {
      font-size: 1.2rem !important;
      font-weight: 700 !important;
      color: #1d4ed8 !important;
    }

    /* Responsive breakpoints for fewer columns on smaller screens */
    @media (max-width: 1400px) {
      .batches-grid {
        grid-template-columns: repeat(4, 1fr); /* 4 columns on smaller desktops */
        gap: 20px;
      }
    }

    @media (max-width: 1200px) {
      .batches-grid {
        grid-template-columns: repeat(3, 1fr); /* 3 columns on tablets */
        gap: 24px;
      }
      
      .batch-title {
        font-size: 1.8rem;
      }
      
      .table-sm td, .table-sm th{
        padding: 1.2rem 1rem;
        font-size: 1.1rem;
      }
    }

    @media (max-width: 992px){
      .main-content{margin-left:0!important}
      .content-area{padding:1rem}
      
      .batches-grid {
        grid-template-columns: repeat(2, 1fr); /* 2 columns on small tablets */
        gap: 28px;
      }
      
      .table-sm td, .table-sm th{
        padding: 1rem 0.75rem;
        font-size: 1rem;
      }
      
      .table tbody tr.featured-row td {
        padding: 1.4rem 1rem !important;
        font-size: 1.4rem !important;
      }
      
      .table tbody tr.featured-row .log-img {
        width: 65px !important;
        height: 65px !important;
      }
      
      .log-img {
        width: 50px !important;
        height: 50px !important;
      }
      
      .table tbody td:nth-child(2) {
        font-size: 1.1rem !important;
      }
      
      .table tbody tr.featured-row td:nth-child(2) {
        font-size: 1.6rem !important;
      }
    }
    
    @media (max-width: 576px){
      .col-time { display:none; }
      .batches-grid {
        grid-template-columns: 1fr; /* 1 column on mobile */
      }
      
      .table-sm td, .table-sm th{
        padding: 0.8rem 0.5rem;
        font-size: 0.9rem;
      }
      
      .table tbody tr.featured-row td {
        padding: 1.2rem 0.8rem !important;
        font-size: 1.2rem !important;
      }
      
      .table tbody tr.featured-row .log-img {
        width: 55px !important;
        height: 55px !important;
      }
      
      .log-img {
        width: 45px !important;
        height: 45px !important;
      }
      
      .table tbody td:nth-child(2) {
        font-size: 1rem !important;
      }
      
      .table tbody tr.featured-row td:nth-child(2) {
        font-size: 1.4rem !important;
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- Sidebar -->
  <div th:replace="fragments/sidebar :: sidebar(role=${role},
                                               activePage='display',
                                               studentInfoExpanded=${studentInfoExpanded},
                                               asmsiExpanded=${asmsiExpanded},
                                               admissionExpanded=${admissionExpanded},
                                               attendanceExpanded=${attendanceExpanded},
                                               eventsExpanded=${eventsExpanded},
                                               familyDayExpanded=${familyDayExpanded})"></div>

  <!-- Main -->
  <div class="main-content">
    <!-- Header -->
    <div th:replace="fragments/header :: header(${username})"></div>

    <!-- Body -->
    <main class="content-area">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
       <h1 class="page-title mb-0 d-flex align-items-center gap-2">
  <i class="bi bi-display me-2 text-primary"></i>
  <span class="grad">Family Day – Visitor Tracker</span>
  <span class="live-indicator">
    <span class="dot"></span> LIVE
  </span>
</h1>

        <div class="time-date-display">
          <div class="d-flex flex-wrap gap-4">
            <div><i class="bi bi-calendar3 me-1 text-primary"></i><span id="main-date"></span></div>
            <div><i class="bi bi-clock me-1 text-primary"></i><span id="main-time"></span></div>
          </div>
        </div>
      </div>

      <!-- Grid of batch cards -->
      <div id="batches-container" class="batches-grid"></div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  /* ===== Live date/time ===== */
  const dateEl = document.getElementById('main-date');
  const timeEl = document.getElementById('main-time');
  function tick(){
    const now = new Date();
    dateEl.textContent = now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    timeEl.textContent = now.toLocaleTimeString('en-US');
  }
  tick(); setInterval(tick, 1000);

  /* ===== Config ===== */
  const ENDPOINT   = '/api/visitingday/logs'; // adjust if different
  let   REFRESH_MS = 1000;                    // 1s polling

  /* ===== Helpers (unchanged UI) ===== */
  const imgTag = src => `<img src="${src || '/images/default-profile.png'}" class="log-img"/>`;
  const normBatch = v => (v ?? '').toString().trim() || 'Unknown Batch';
  const batchSortKey = s => { const m = s.match(/(\d+)/); return m ? parseInt(m[1],10) : Number.POSITIVE_INFINITY; };

  function renderBatches(grouped){
    const container = document.getElementById('batches-container');
    const batchNames = Object.keys(grouped).sort((a,b)=>{
      const ka=batchSortKey(a), kb=batchSortKey(b);
      if(ka!==kb) return ka-kb;
      return a.localeCompare(b);
    });

    if (batchNames.length === 0){
      container.innerHTML = `<div class="alert alert-info mb-0">No logs available.</div>`;
      return;
    }

    container.innerHTML = batchNames.map(batch=>{
      const rows = grouped[batch] || [];
      const show = Math.min(rows.length, 10); // cap 10 per card
      const countTxt = `${rows.length} visitor${rows.length===1?'':'s'}${rows.length>10?` • showing top 10`:''}`;

      const body = rows.slice(0, show).map((r, index) => {
        const featuredClass = index === 0 && rows.length > 0 ? 'featured-row' : '';
        return `
          <tr class="${featuredClass}">
            <td class="text-center">${imgTag(r.imageUrl)}</td>
            <td>${r.name ?? '-'}</td>
            <td class="col-time">${r.timeIn ?? r.time ?? '-'}</td>
          </tr>
        `;
      }).join('');

      return `
        <div class="card batch-card">
          <div class="card-header">
            <h5 class="batch-title mb-0">${batch}</h5>
            <span class="badge-soft rounded-pill px-3 py-2">${countTxt}</span>
          </div>
          <div class="table-wrap">
            <table class="table table-sm table-striped table-bordered align-middle mb-0">
              <thead>
                <tr>
                  <th class="col-photo text-center">Photo</th>
                  <th>Student Name</th>
                  <th class="col-time">Time In</th>
                </tr>
              </thead>
              <tbody>
                ${body || `<tr><td colspan="3" class="text-center text-muted">No visitors yet</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }).join('');
  }

  /* ===== Live loader (polling + dedupe + abort) ===== */
  let lastHash = null;
  let inflightController = null;
  let timer = null;

  function hashString(s){
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h << 5) - h + s.charCodeAt(i) | 0;
    return h;
  }

  async function fetchAll(){
    if (inflightController) inflightController.abort();
    inflightController = new AbortController();

    const r = await fetch(ENDPOINT, {
      signal: inflightController.signal,
      cache: 'no-store',
      headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' }
    });
    if (!r.ok) throw new Error(r.status);

    const data = await r.json();

    // group by batch (no date filter now)
    const grouped = {};
    (data || []).forEach(row=>{
      const key = normBatch(row.batchNumber);
      (grouped[key] ||= []).push(row);
    });

    return grouped;
  }

  async function loop(){
    try{
      const grouped = await fetchAll();
      const snapshot = JSON.stringify(grouped);
      const h = hashString(snapshot);

      if (h !== lastHash){
        renderBatches(grouped);
        lastHash = h;
      }
    }catch(e){
      if (e.name !== 'AbortError'){
        console.error(e);
        document.getElementById('batches-container').innerHTML =
          `<div class="alert alert-danger">Failed to load logs.</div>`;
      }
    }finally{
      timer = setTimeout(loop, REFRESH_MS);
    }
  }

  // adaptive interval: slower when tab is hidden
  function updateInterval(){
    REFRESH_MS = document.hidden ? 3000 : 1000;
  }
  document.addEventListener('visibilitychange', updateInterval);
  updateInterval();

  // start
  loop();
</script>

</body>
</html>
