<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Project salary cost')}"></head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar(role=${role}, activePage=${activePage})}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/header :: header(${username})}"></div>
    <main class="content-area" th:fragment="page" data-section="Reports" data-title="Project salary cost">
      <div class="page-header">
        <div><div class="page-eyebrow">Reports</div><h1 class="page-title">Project salary cost</h1>
          <p class="page-sub">Labor charged to each job order from posted payrolls (5020 Direct labor), against office salaries (6010).</p></div>
        <form class="page-actions d-flex gap-2 align-items-end" method="get">
          <div><label class="form-label small mb-0" for="rf">From</label><input id="rf" type="date" name="from" class="form-control form-control-sm" th:value="${from}" /></div>
          <div><label class="form-label small mb-0" for="rt">To</label><input id="rt" type="date" name="to" class="form-control form-control-sm" th:value="${to}" /></div>
          <button class="btn btn-sm btn-outline" type="submit">Show</button>
          <button class="btn btn-sm btn-ghost" type="button" onclick="window.print()"><i class="bi bi-printer"></i>Print</button>
        </form>
      </div>
      <section class="panel">
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Job order</th><th class="money">Labor cost</th></tr></thead>
          <tbody><tr th:each="r : ${rows}"><td th:text="${r.job() != null ? r.job().label() : 'Not tagged to a job'}"></td><td class="money" th:text="${#numbers.formatDecimal(r.amount(), 1, 'COMMA', 2, 'POINT')}"></td></tr>
            <tr><td class="text-muted">Office salaries (6010)</td><td class="money text-muted" th:text="${#numbers.formatDecimal(office, 1, 'COMMA', 2, 'POINT')}"></td></tr></tbody>
          <tfoot><tr class="tb-total"><td>Total charged to jobs</td><td class="money" th:text="${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></td></tr></tfoot>
        </table></div>
        <div class="panel-body text-muted small" th:if="${#lists.isEmpty(rows)}">No payroll posted in this period (Accounting › Payroll).</div>
      </section>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
