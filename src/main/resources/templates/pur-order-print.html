<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title th:text="${'PO ' + po.number}">PO</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 12px/1.45 "IBM Plex Sans", "Segoe UI", Arial, sans-serif; color: #142033; background: #e9ecf1; }
    .bar { position: sticky; top: 0; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #0b1524; color: #fff; font-size: 13px; }
    .bar button { margin-left: auto; padding: 7px 16px; border: 0; border-radius: 6px; background: #c8151d; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .sheet { width: 210mm; min-height: 297mm; margin: 16px auto; padding: 16mm 14mm; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
    .top { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #142033; padding-bottom: 8px; }
    .co { display: flex; gap: 12px; align-items: center; }
    .co img { height: 54px; }
    .co b { display: block; font-size: 15px; text-transform: uppercase; letter-spacing: .02em; }
    .ttl { text-align: right; }
    .ttl h1 { margin: 0; font-size: 20px; letter-spacing: .1em; color: #c8151d; }
    .ttl .no { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 700; }
    .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 14px 0; }
    .parties h2 { margin: 0 0 4px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #526176; }
    .parties b { font-size: 13px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th { background: #22385a; color: #fff; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; text-align: left; padding: 6px; }
    td { padding: 6px; border-bottom: 1px solid #d5dbe3; }
    .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    tfoot td { border: 0; padding: 4px 6px; }
    tfoot tr.t td { font-weight: 700; font-size: 14px; border-top: 2px solid #142033; }
    .notes { margin-top: 14px; padding: 8px 10px; background: #f3f5f8; border-radius: 4px; }
    .sign { display: flex; gap: 16mm; margin-top: 24mm; }
    .sign div { flex: 1; border-top: 1px solid #142033; padding-top: 3px; text-align: center; color: #526176; font-size: 11px; }
    .draft { color: #a15c00; font-weight: 700; }
    @media print { @page { size: A4; margin: 0; } body { background: #fff; } .bar { display: none; } .sheet { margin: 0; box-shadow: none; } }
      .co-line { display: block; font-size: 10px; color: #555; max-width: 420px; margin-top: 2px; line-height: 1.35; }
  </style>
</head>
<body>
  <div class="bar"><b th:text="${'Purchase order ' + po.number}"></b><span th:if="${po.editable}">· DRAFT — not yet placed</span><button type="button" onclick="window.print()">Print</button></div>
  <div class="sheet">
    <div class="top">
      <div class="co"><img th:src="@{/images/logo-cbm.webp}" alt="" /><div><b th:text="${company != null ? company.name : 'CBM Engineering & Construction'}">CBM Engineering &amp; Construction</b><span>Purchasing</span><small class="co-line" th:if="${company != null and !#strings.isEmpty(company.contactLine)}" th:text="${company.contactLine}"></small></div></div>
      <div class="ttl"><h1>PURCHASE ORDER</h1><div class="no" th:text="${po.number}"></div><div th:text="${'Date: ' + #temporals.format(po.orderDate, 'MMMM d, yyyy')}"></div><div class="draft" th:if="${po.editable}">DRAFT</div></div>
    </div>
    <div class="parties">
      <div><h2>Supplier</h2><b th:text="${supplier != null ? supplier.name : ''}"></b>
        <div th:if="${supplier != null and supplier.address != null}" th:text="${supplier.address}"></div>
        <div th:if="${supplier != null and supplier.contactPerson != null}" th:text="${'Attn: ' + supplier.contactPerson + (supplier.phone != null ? ' · ' + supplier.phone : '')}"></div>
        <div th:if="${supplier != null and supplier.tin != null}" th:text="${'TIN ' + supplier.tin}"></div></div>
      <div><h2>Deliver to</h2><b th:text="${po.deliverTo ?: 'CBM warehouse'}"></b>
        <div th:if="${job}" th:text="${'For ' + job.label}"></div>
        <div th:if="${po.expectedDate}" th:text="${'Needed by ' + #temporals.format(po.expectedDate, 'MMMM d, yyyy')}"></div>
        <div th:if="${po.paymentTerms}" th:text="${'Terms: ' + po.paymentTerms}"></div></div>
    </div>
    <table>
      <thead><tr><th>#</th><th>Description</th><th class="r">Qty</th><th>Unit</th><th class="r">Unit price</th><th class="r">Amount</th></tr></thead>
      <tbody>
        <tr th:each="l, st : ${lines}"><td th:text="${st.count}"></td><td th:text="${l.description}"></td><td class="r" th:text="${l.qty.stripTrailingZeros().toPlainString()}"></td><td th:text="${l.unit}"></td>
          <td class="r" th:text="${#numbers.formatDecimal(l.unitPrice, 1, 'COMMA', 2, 'POINT')}"></td><td class="r" th:text="${#numbers.formatDecimal(l.amount, 1, 'COMMA', 2, 'POINT')}"></td></tr>
      </tbody>
      <tfoot>
        <tr><td colspan="5" class="r">Subtotal</td><td class="r" th:text="${#numbers.formatDecimal(subtotal, 1, 'COMMA', 2, 'POINT')}"></td></tr>
        <tr th:if="${tax.signum() != 0}"><td colspan="5" class="r" th:text="${'Tax ' + po.taxRate.stripTrailingZeros().toPlainString() + '%'}"></td><td class="r" th:text="${#numbers.formatDecimal(tax, 1, 'COMMA', 2, 'POINT')}"></td></tr>
        <tr class="t"><td colspan="5" class="r">TOTAL</td><td class="r" th:text="${'₱' + #numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></td></tr>
      </tfoot>
    </table>
    <div class="notes" th:if="${po.notes}" th:text="${po.notes}"></div>
    <div class="sign"><div>Prepared by</div><div>Approved by</div><div>Supplier's conforme / date</div></div>
  </div>
</body>
</html>
