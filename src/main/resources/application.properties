# Hibernate settings
spring.jpa.hibernate.ddl-auto=update

# SQL logging off: printing every query slows each request. Turn on only while debugging.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Load lazy collections in batches instead of one query per row
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Connection pool tuned for Neon (remote, auto-suspending Postgres)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=240000
spring.datasource.hikari.max-lifetime=900000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

