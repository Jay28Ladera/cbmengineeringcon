spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# Templates are cached in production. Spring DevTools turns caching off automatically while you develop.
spring.thymeleaf.cache=true

# ---- Page speed ----
# Gzip HTML, CSS, JS and JSON responses
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
# Static files get a content hash in their URL (e.g. app-3f2a….css), so browsers can cache them for a year
# and still pick up every change immediately.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/vendor/**,/images/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Behind Render's proxy: use the public host and https from X-Forwarded-* headers when building links.
server.forward-headers-strategy=framework
# Public address used in emails (password reset, approval, staff activation links).
# Leave blank to use the address of the request, or set it, e.g. https://cbm-portal.onrender.com
app.base-url=

