spring.application.name=admin-system
file.upload-dir=uploads
spring.config.import=optional:file:./secrets.properties

# PostgreSQL Database Configuration (Ensure Correct URL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update

# SQL logging off: printing every query slows each request. Turn on only while debugging.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Load lazy collections in batches instead of one query per row
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Connection pool tuned for Neon (remote, auto-suspending Postgres)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=240000
spring.datasource.hikari.max-lifetime=900000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB


# Security (Basic Auth for Testing)
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD}
spring.security.user.roles=ADMIN

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# Templates are cached in production. Spring DevTools turns caching off automatically while you develop.
spring.thymeleaf.cache=true

# ---- Page speed ----
# Gzip HTML, CSS, JS and JSON responses
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
# Static files get a content hash in their URL (e.g. app-3f2a….css), so browsers can cache them for a year
# and still pick up every change immediately.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/vendor/**,/images/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Behind Render's proxy: use the public host and https from X-Forwarded-* headers when building links.
server.forward-headers-strategy=framework
# Public address used in emails (password reset, approval, staff activation links).
# Leave blank to use the address of the request, or set it, e.g. https://cbm-portal.onrender.com
app.base-url=

# Email Configuration (SMTP)
# Gmail SMTP Configuration
# Resend API

# Prefer setting RESEND_API_KEY on Render; the key written here is only a fallback and should be rotated.
resend.api.key=${RESEND_API_KEY:}

resend.from.email=${RESEND_FROM:carlcbm@cbmengineeringcon.com}
# Sender shown on quotation emails to clients, e.g. CBM Engineering & Construction <quotes@cbm-domain.ph>
# (the domain must be verified in Resend). Blank = resend.from.email.
quote.mail.from=${QUOTE_MAIL_FROM:}